<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>404 — No Encontrado</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --yellow: #ECD925;
      --yellow-dark: #c9b800;
      --yellow-light: #fffef5;
      --bg: #f0f0f0;
      --surface: #ffffff;
      --surface2: #f6f6f6;
      --border: #e0e0e0;
      --text: #111111;
      --text-muted: #666;
      --warning: #d97706;
      --radius: 14px;
      --radius-sm: 8px;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      display: flex;
      align-items: center;
      padding: 16px 32px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      box-shadow: 0 1px 6px rgba(0,0,0,0.06);
    }

    .brand-dot {
      width: 28px; height: 28px;
      background: var(--yellow);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      font-weight: 700;
      margin-right: 10px;
    }

    .brand-name {
      font-family: 'Space Mono', monospace;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 2px 16px rgba(0,0,0,0.06);
      padding: 48px 40px;
      max-width: 500px;
      width: 100%;
      text-align: center;
      animation: fadeUp 0.45s cubic-bezier(0.16,1,0.3,1) both;
    }

    @keyframes fadeUp {
      from { opacity:0; transform:translateY(18px); }
      to   { opacity:1; transform:translateY(0); }
    }

    .icon-wrap {
      width: 60px; height: 60px;
      background: var(--yellow-light);
      border: 1px solid #f0e060;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    .icon-wrap svg {
      width: 26px; height: 26px;
      stroke: var(--warning);
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--yellow-light);
      border: 1px solid #f0e060;
      color: var(--warning);
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 20px;
    }

    .status-pill::before {
      content: '';
      width: 5px; height: 5px;
      background: var(--yellow-dark);
      border-radius: 50%;
    }

    .error-code {
      font-family: 'Space Mono', monospace;
      font-size: clamp(4.5rem, 15vw, 7rem);
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1;
      color: var(--text);
      margin-bottom: 6px;
    }

    .error-code .mid { color: var(--yellow-dark); }

    .error-title {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: -0.3px;
      margin-bottom: 10px;
    }

    .error-desc {
      font-size: 0.875rem;
      color: var(--text-muted);
      line-height: 1.75;
      max-width: 370px;
      margin: 0 auto 24px;
    }

    /* Path box */
    .path-box {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-left: 3px solid var(--yellow-dark);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      text-align: left;
      margin-bottom: 20px;
    }

    .path-label {
      font-family: 'Space Mono', monospace;
      font-size: 0.65rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 4px;
    }

    .path-value {
      font-family: 'Space Mono', monospace;
      font-size: 0.82rem;
      color: var(--text);
      word-break: break-all;
    }

    /* Suggestions */
    .suggestions {
      margin-bottom: 28px;
    }

    .sug-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-family: 'Space Mono', monospace;
      margin-bottom: 10px;
    }

    .sug-tags {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .sug-tag {
      padding: 5px 12px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 999px;
      font-family: 'Space Mono', monospace;
      font-size: 0.72rem;
      color: var(--text-muted);
      text-decoration: none;
      transition: all 0.18s;
    }

    .sug-tag:hover {
      background: var(--yellow-light);
      border-color: var(--yellow-dark);
      color: var(--text);
    }

    .actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 20px;
      border: none;
      border-radius: var(--radius-sm);
      font-family: 'DM Sans', sans-serif;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.18s;
    }

    .btn-primary {
      background: var(--yellow);
      color: #111;
      border: 1px solid var(--yellow-dark);
    }

    .btn-primary:hover {
      background: var(--yellow-dark);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(201,184,0,0.3);
    }

    .btn-ghost {
      background: var(--surface2);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }

    .btn-ghost:hover {
      color: var(--text);
      border-color: #bbb;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand-dot">G</div>
    <span class="brand-name">GEPI</span>
  </header>

  <main class="main">
    <div class="card">
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </div>

      <div class="status-pill">Recurso no encontrado</div>

      <div class="error-code">4<span class="mid">0</span>4</div>
      <div class="error-title">Página No Encontrada</div>
      <p class="error-desc">
        La ruta o recurso que buscas no existe en este servidor. Puede haber sido movido, eliminado o la URL podría ser incorrecta.
      </p>

      <div class="path-box">
        <div class="path-label">Ruta solicitada</div>
        <div class="path-value" id="currentPath">/ruta/no/encontrada</div>
      </div>

      <div class="suggestions">
        <div class="sug-label">Quizás buscabas</div>
        <div class="sug-tags">
          <a href="/" class="sug-tag">/inicio</a>
          <a href="/dashboard" class="sug-tag">/dashboard</a>
          <a href="/solicitudes" class="sug-tag">/solicitudes</a>
          <a href="/ayuda" class="sug-tag">/ayuda</a>
        </div>
      </div>

      <div class="actions">
        <a href="/" class="btn btn-primary">Ir al inicio</a>
        <a href="javascript:history.back()" class="btn btn-ghost">Volver atrás</a>
      </div>
    </div>
  </main>

  <script>
    document.getElementById('currentPath').textContent = window.location.pathname || '/ruta/no/encontrada';
  </script>
</body>
</html>
