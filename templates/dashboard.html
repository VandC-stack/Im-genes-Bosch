<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard SEA</title>
    <link rel="icon" href="/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --yellow: #ECD925;
            --yellow-dark: #c9b800;
            --yellow-light: #fffef5;
            --bg: #f0f0f0;
            --surface: #ffffff;
            --surface2: #f6f6f6;
            --border: #e0e0e0;
            --text: #111111;
            --text-muted: #666;
            --text-dim: #aaa;
            --dark: #1a1a1a;
            --danger: #cc3333;
            --success: #2a9d5c;
            --warning: #d97706;
            --radius: 14px;
            --radius-sm: 8px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* ── TOPBAR ── */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 32px;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 1px 6px rgba(0, 0, 0, 0.06);
        }

        .topbar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-dot {
            width: 28px;
            height: 28px;
            background: var(--yellow);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
        }

        .brand-name {
            font-family: 'Space Mono', monospace;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .user-chip {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 6px 14px 6px 8px;
            font-size: 13px;
            color: var(--text);
        }

        .user-avatar {
            width: 24px;
            height: 24px;
            background: var(--yellow);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            color: #000;
        }

        .logout-link {
            font-size: 13px;
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s;
        }

        .logout-link:hover {
            color: var(--dark);
        }

        /* ── PAGE ── */
        .page {
            max-width: 1200px;
            margin: 0 auto;
            padding: 36px 24px;
        }

        /* ── PAGE HEADER ── */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .page-title {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -1px;
            line-height: 1.1;
        }

        .page-title span {
            color: var(--yellow-dark);
        }

        .page-sub {
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 10px 18px;
            border: none;
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
        }

        .btn-yellow {
            background: var(--yellow);
            color: #000;
        }

        .btn-yellow:hover {
            background: var(--yellow-dark);
            transform: translateY(-1px);
        }

        .btn-outline {
            background: transparent;
            color: var(--text);
            border: 1.5px solid var(--border);
        }

        .btn-outline:hover {
            border-color: #999;
            background: var(--surface);
        }

        /* ── KPI CARDS ── */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 14px;
            margin-bottom: 28px;
        }

        .kpi-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px 22px;
            transition: box-shadow 0.2s;
        }

        .kpi-card:hover {
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.07);
        }

        .kpi-label {
            font-size: 11px;
            font-family: 'Space Mono', monospace;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .kpi-value {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -1.5px;
            line-height: 1;
        }

        .kpi-sub {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 6px;
        }

        .kpi-card.accent {
            background: var(--yellow);
            border-color: var(--yellow-dark);
        }

        .kpi-card.accent .kpi-label,
        .kpi-card.accent .kpi-sub {
            color: rgba(0, 0, 0, 0.55);
        }

        /* ── FILTERS ── */
        .filters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 18px;
            align-items: center;
        }

        .filter-label {
            font-size: 12px;
            font-family: 'Space Mono', monospace;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-right: 4px;
        }

        .filter-chip {
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            border: 1.5px solid var(--border);
            background: var(--surface);
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text);
        }

        .filter-chip:hover,
        .filter-chip.active {
            background: var(--dark);
            color: #fff;
            border-color: var(--dark);
        }

        .search-input {
            margin-left: auto;
            padding: 7px 14px;
            border-radius: 999px;
            border: 1.5px solid var(--border);
            background: var(--surface);
            font-family: inherit;
            font-size: 13px;
            color: var(--text);
            width: 220px;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            outline: none;
            border-color: #999;
        }

        /* ── TABLE WRAPPER ── */
        .table-wrap {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
        }

        .table-scroll {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 820px;
        }

        thead {
            background: var(--surface2);
            border-bottom: 2px solid var(--border);
        }

        th {
            padding: 13px 16px;
            text-align: left;
            font-size: 11px;
            font-family: 'Space Mono', monospace;
            text-transform: uppercase;
            letter-spacing: 0.7px;
            color: var(--text-muted);
            white-space: nowrap;
            cursor: pointer;
            user-select: none;
            transition: color 0.2s;
        }

        th:hover {
            color: var(--dark);
        }

        th .sort-arrow {
            display: inline-block;
            margin-left: 4px;
            opacity: 0.35;
            font-size: 10px;
        }

        th.sorted .sort-arrow {
            opacity: 1;
        }

        tbody tr {
            border-bottom: 1px solid var(--border);
            transition: background 0.15s;
        }

        tbody tr:last-child {
            border-bottom: none;
        }

        tbody tr:hover {
            background: var(--yellow-light);
        }

        td {
            padding: 13px 16px;
            font-size: 13px;
            vertical-align: middle;
        }

        .td-folio {
            font-family: 'Space Mono', monospace;
            font-size: 12px;
            font-weight: 700;
            color: var(--dark);
        }

        .td-date {
            font-size: 12px;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .td-proyecto {
            max-width: 260px;
            font-weight: 500;
            line-height: 1.35;
        }

        /* ── BADGES ── */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
        }

        .badge-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .badge-finalizado {
            background: #dcfce7;
            color: #166534;
        }

        .badge-finalizado .badge-dot {
            background: #16a34a;
        }

        .badge-proceso {
            background: #fef9c3;
            color: #854d0e;
        }

        .badge-proceso .badge-dot {
            background: #ca8a04;
        }

        .badge-pendiente {
            background: #fee2e2;
            color: #991b1b;
        }

        .badge-pendiente .badge-dot {
            background: #dc2626;
        }

        .badge-revision {
            background: #e0f2fe;
            color: #075985;
        }

        .badge-revision .badge-dot {
            background: #0284c7;
        }

        /* ── CUMPLIMIENTO ── */
        .cumplimiento {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 600;
        }

        .cumplimiento.ok {
            color: var(--success);
        }

        .cumplimiento.fail {
            color: var(--danger);
        }

        .cumplimiento.pending {
            color: var(--text-dim);
        }

        /* ── ACTION BUTTONS ── */
        .action-btns {
            display: flex;
            gap: 6px;
        }

        .action-btn {
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            border: 1.5px solid var(--border);
            background: transparent;
            cursor: pointer;
            text-decoration: none;
            color: var(--text);
            transition: all 0.2s;
            white-space: nowrap;
        }

        .action-btn:hover {
            background: var(--dark);
            color: #fff;
            border-color: var(--dark);
        }

        .action-btn.primary {
            background: var(--yellow);
            border-color: var(--yellow-dark);
            color: #000;
        }

        .action-btn.primary:hover {
            background: var(--yellow-dark);
        }

        /* ── TABLE FOOTER ── */
        .table-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 18px;
            border-top: 1px solid var(--border);
            font-size: 12px;
            color: var(--text-muted);
            background: var(--surface2);
        }

        /* ── EMPTY ── */
        .empty-row td {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
            font-size: 14px;
        }

        /* ── MODAL ── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 32px;
            max-width: 520px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            animation: modalIn 0.2s ease;
        }

        @keyframes modalIn {
            from {
                opacity: 0;
                transform: scale(0.96) translateY(12px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: var(--text-muted);
            line-height: 1;
            transition: color 0.2s;
        }

        .modal-close:hover {
            color: var(--dark);
        }

        .modal-field {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
            gap: 12px;
        }

        .modal-field:last-child {
            border-bottom: none;
        }

        .modal-field-label {
            font-size: 12px;
            color: var(--text-muted);
            font-family: 'Space Mono', monospace;
            flex-shrink: 0;
        }

        .modal-field-value {
            font-size: 13px;
            font-weight: 500;
            text-align: right;
        }

        /* ── TOAST ── */
        .toast {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 22px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
            min-width: 280px;
            max-width: 420px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease;
            z-index: 999;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
            pointer-events: auto;
        }

        .toast.success {
            background: #1a1a1a;
            color: #fff;
            border-left: 4px solid var(--yellow);
        }

        .toast.error {
            background: #1a1a1a;
            color: #fff;
            border-left: 4px solid #e05555;
        }

        .toast-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .toast.success .toast-icon {
            background: rgba(236, 217, 37, 0.15);
        }

        .toast.error .toast-icon {
            background: rgba(224, 85, 85, 0.15);
        }

        .toast-body {
            flex: 1;
        }

        .toast-title {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .toast-desc {
            font-size: 12px;
            font-weight: 400;
            opacity: 0.65;
        }

        .toast-close {
            background: none;
            border: none;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            opacity: 0.5;
            padding: 0 2px;
            transition: opacity 0.2s;
            line-height: 1;
        }

        .toast-close:hover {
            opacity: 1;
        }

        /* ── RESPONSIVE ── */
        @media (max-width: 700px) {
            .topbar {
                padding: 12px 16px;
            }

            .page {
                padding: 24px 14px;
            }

            .page-title {
                font-size: 22px;
            }

            .search-input {
                width: 100%;
                margin-left: 0;
            }

            .filters {
                gap: 8px;
            }
        }
    </style>
</head>

<body>

    <!-- TOPBAR -->
    <nav class="topbar">
        <div class="topbar-brand">
            <div class="brand-dot">📁</div>
            <span class="brand-name">FileVault</span>
        </div>
        <div class="topbar-right">
            <div class="user-chip">
                <div class="user-avatar" id="avatarInitial">U</div>
                <span id="usernameDisplay">{{ username }}</span>
            </div>
            <a href="/logout" class="logout-link">Cerrar sesión →</a>
        </div>
    </nav>

    <!-- PAGE -->
    <main class="page">

        <!-- Header -->
        <div class="page-header">
            <div>
                <h1 class="page-title">Mis <span>solicitudes</span></h1>
                <p class="page-sub">Resumen y seguimiento de todos tus proyectos SEA</p>
            </div>
            <div style="display:flex; gap:10px; flex-wrap:wrap;">
                <a href="/" class="btn btn-outline">← Subir archivos</a>
                <button class="btn btn-yellow" onclick="exportCSV()">⬇ Exportar</button>
            </div>
        </div>

        <!-- KPIs -->
        <div class="kpi-grid" id="kpiGrid">
            <!-- filled by JS -->
        </div>

        <!-- Filters + Search -->
        <div class="filters">
            <span class="filter-label">Filtrar:</span>
            <button class="filter-chip active" data-filter="all" onclick="setFilter(this,'all')">Todos</button>
            <button class="filter-chip" data-filter="FINALIZADO"
                onclick="setFilter(this,'FINALIZADO')">Finalizados</button>
            <button class="filter-chip" data-filter="EN PROCESO" onclick="setFilter(this,'EN PROCESO')">En
                proceso</button>
            <button class="filter-chip" data-filter="PENDIENTE"
                onclick="setFilter(this,'PENDIENTE')">Pendientes</button>
            <button class="filter-chip" data-filter="EN REVISIÓN" onclick="setFilter(this,'EN REVISIÓN')">En
                revisión</button>
            <input class="search-input" id="searchInput" type="search" placeholder="🔍 Buscar folio o proyecto…"
                oninput="renderTable()">
        </div>

        <!-- Table -->
        <div class="table-wrap">
            <div class="table-scroll">
                <table id="mainTable">
                    <thead>
                        <tr>
                            <th onclick="sortBy('fecha')" id="th-fecha">Fecha recepción <span
                                    class="sort-arrow">↕</span></th>
                            <th onclick="sortBy('folio')" id="th-folio">Folio <span class="sort-arrow">↕</span></th>
                            <th onclick="sortBy('tipo')" id="th-tipo">Tipo de servicio <span class="sort-arrow">↕</span>
                            </th>
                            <th onclick="sortBy('modalidad')" id="th-modalidad">Modalidad <span
                                    class="sort-arrow">↕</span></th>
                            <th onclick="sortBy('proyecto')" id="th-proyecto">Nombre del proyecto <span
                                    class="sort-arrow">↕</span></th>
                            <th onclick="sortBy('estatus')" id="th-estatus">Estatus <span class="sort-arrow">↕</span>
                            </th>
                            <th>Cumplimiento</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
            <div class="table-footer">
                <span id="footerCount">0 solicitudes</span>
                <span id="footerDate"></span>
            </div>
        </div>

    </main>

    <!-- MODAL -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
        <div class="modal">
            <div class="modal-header">
                <span class="modal-title" id="modalTitle">Detalle de solicitud</span>
                <button class="modal-close" onclick="closeModalBtn()">×</button>
            </div>
            <div id="modalBody"></div>
        </div>
    </div>

    <!-- TOAST -->
    <div class="toast" id="toast">
        <div class="toast-icon" id="toastIcon"></div>
        <div class="toast-body">
            <div class="toast-title" id="toastTitle"></div>
            <div class="toast-desc" id="toastDesc"></div>
        </div>
        <button class="toast-close" onclick="hideToast()">×</button>
    </div>

    <script>
        /* =====================
           DATA — reemplaza con tu API: fetch('/api/solicitudes').then(r=>r.json()).then(data => { solicitudes = data; init(); })
           ===================== */
        let solicitudes = [
            {
                fecha: "2026-02-18 10:14",
                folio: "ACT-2026-003",
                tipo: "ACTUALIZACIÓN",
                prefijo: "ACT",
                anio: "2026",
                consecutivo: "003",
                modalidad: "REGULAR",
                proyecto: "ACTUALIZACIÓN DE CONSTANCIAS MERMELADAS Y RELLENOS PARA TARTA Y BONNE MAMAN",
                estatus: "FINALIZADO",
                fechaEnvio: null,
                cumplimiento: "≤ 72 h — Se cumplió",
                cumplimientoOk: true,
            },
            {
                fecha: "2026-02-18 10:19",
                folio: "CTII-2026-004",
                tipo: "CONSULTORÍA TIPO II",
                prefijo: "CTII",
                anio: "2026",
                consecutivo: "004",
                modalidad: "REGULAR",
                proyecto: "RECETA NUEVA — CREMA DE CACAHUATE Y CACAO 350 G",
                estatus: "FINALIZADO",
                fechaEnvio: null,
                cumplimiento: "≤ 24 h — Se cumplió",
                cumplimientoOk: true,
            }
        ];
        // ── Agrega más registros aquí o carga desde API ──

        /* =====================
           STATE
           ===================== */
        let currentFilter = "all";
        let sortKey = "fecha";
        let sortDir = 1;

        /* =====================
           INIT
           ===================== */
        function init() {
            const uname = document.getElementById("usernameDisplay").textContent.trim();
            if (uname && !uname.includes("{{")) {
                document.getElementById("avatarInitial").textContent = uname[0].toUpperCase();
            }
            document.getElementById("footerDate").textContent = "Actualizado: " + new Date().toLocaleDateString('es-MX', { day: '2-digit', month: 'short', year: 'numeric' });
            buildKPIs();
            renderTable();
        }

        /* =====================
           KPIs
           ===================== */
        function buildKPIs() {
            const total = solicitudes.length;
            const finalizados = solicitudes.filter(s => s.estatus === "FINALIZADO").length;
            const enProceso = solicitudes.filter(s => s.estatus === "EN PROCESO").length;
            const pendientes = solicitudes.filter(s => s.estatus === "PENDIENTE").length;
            const cumplidos = solicitudes.filter(s => s.cumplimientoOk === true).length;
            const pct = total > 0 ? Math.round(cumplidos / total * 100) : 0;

            const grid = document.getElementById("kpiGrid");
            grid.innerHTML = `
            <div class="kpi-card accent">
                <div class="kpi-label">Total solicitudes</div>
                <div class="kpi-value">${total}</div>
                <div class="kpi-sub">Todos los proyectos</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-label">Finalizados</div>
                <div class="kpi-value">${finalizados}</div>
                <div class="kpi-sub">Proyectos completados</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-label">En proceso</div>
                <div class="kpi-value">${enProceso}</div>
                <div class="kpi-sub">En atención activa</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-label">Pendientes</div>
                <div class="kpi-value">${pendientes}</div>
                <div class="kpi-sub">En espera de inicio</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-label">Cumplimiento</div>
                <div class="kpi-value">${pct}%</div>
                <div class="kpi-sub">Tiempo de entrega</div>
            </div>
        `;
        }

        /* =====================
           FILTER
           ===================== */
        function setFilter(el, filter) {
            currentFilter = filter;
            document.querySelectorAll(".filter-chip").forEach(c => c.classList.remove("active"));
            el.classList.add("active");
            renderTable();
        }

        /* =====================
           SORT
           ===================== */
        function sortBy(key) {
            if (sortKey === key) { sortDir *= -1; } else { sortKey = key; sortDir = 1; }
            document.querySelectorAll("th").forEach(th => th.classList.remove("sorted"));
            const th = document.getElementById("th-" + key);
            if (th) th.classList.add("sorted");
            renderTable();
        }

        /* =====================
           RENDER TABLE
           ===================== */
        function renderTable() {
            const query = document.getElementById("searchInput").value.toLowerCase();

            let data = solicitudes.filter(s => {
                const matchFilter = currentFilter === "all" || s.estatus === currentFilter;
                const matchSearch = !query ||
                    s.folio.toLowerCase().includes(query) ||
                    s.proyecto.toLowerCase().includes(query) ||
                    s.tipo.toLowerCase().includes(query);
                return matchFilter && matchSearch;
            });

            data.sort((a, b) => {
                let va = a[sortKey] || "";
                let vb = b[sortKey] || "";
                return va > vb ? sortDir : va < vb ? -sortDir : 0;
            });

            const tbody = document.getElementById("tableBody");

            if (data.length === 0) {
                tbody.innerHTML = `<tr class="empty-row"><td colspan="8">No se encontraron solicitudes.</td></tr>`;
                document.getElementById("footerCount").textContent = "0 solicitudes";
                return;
            }

            tbody.innerHTML = data.map((s, i) => `
            <tr>
                <td class="td-date">${formatDate(s.fecha)}</td>
                <td class="td-folio">${s.folio}</td>
                <td style="font-size:12px;">${s.tipo}</td>
                <td><span style="font-size:12px; background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:3px 8px;">${s.modalidad}</span></td>
                <td class="td-proyecto">${s.proyecto}</td>
                <td>${statusBadge(s.estatus)}</td>
                <td>${cumplimientoHtml(s)}</td>
                <td>
                    <div class="action-btns">
                        <button class="action-btn primary" onclick="openModal(${solicitudes.indexOf(s)})">Ver detalle</button>
                        <button class="action-btn" onclick="descargar('${s.folio}')">⬇ Cert.</button>
                    </div>
                </td>
            </tr>
        `).join("");

            document.getElementById("footerCount").textContent =
                data.length + (data.length === 1 ? " solicitud" : " solicitudes");
        }

        function statusBadge(estatus) {
            const map = {
                "FINALIZADO": ["badge-finalizado", "Finalizado"],
                "EN PROCESO": ["badge-proceso", "En proceso"],
                "PENDIENTE": ["badge-pendiente", "Pendiente"],
                "EN REVISIÓN": ["badge-revision", "En revisión"],
            };
            const [cls, label] = map[estatus] || ["badge-pendiente", estatus];
            return `<span class="badge ${cls}"><span class="badge-dot"></span>${label}</span>`;
        }

        function cumplimientoHtml(s) {
            if (!s.cumplimiento) return `<span class="cumplimiento pending">—</span>`;
            const cls = s.cumplimientoOk ? "ok" : "fail";
            const icon = s.cumplimientoOk ? "✓" : "✕";
            return `<span class="cumplimiento ${cls}">${icon} ${s.cumplimiento}</span>`;
        }

        function formatDate(str) {
            if (!str) return "—";
            const d = new Date(str);
            if (isNaN(d)) return str;
            return d.toLocaleDateString('es-MX', { day: '2-digit', month: 'short', year: 'numeric' });
        }

        /* =====================
           MODAL
           ===================== */
        function openModal(idx) {
            const s = solicitudes[idx];
            document.getElementById("modalTitle").textContent = s.folio;
            document.getElementById("modalBody").innerHTML = `
            <div class="modal-field"><span class="modal-field-label">Proyecto</span><span class="modal-field-value">${s.proyecto}</span></div>
            <div class="modal-field"><span class="modal-field-label">Tipo de servicio</span><span class="modal-field-value">${s.tipo}</span></div>
            <div class="modal-field"><span class="modal-field-label">Modalidad</span><span class="modal-field-value">${s.modalidad}</span></div>
            <div class="modal-field"><span class="modal-field-label">Fecha de recepción</span><span class="modal-field-value">${s.fecha}</span></div>
            <div class="modal-field"><span class="modal-field-label">Fecha de envío</span><span class="modal-field-value">${s.fechaEnvio || "—"}</span></div>
            <div class="modal-field"><span class="modal-field-label">Estatus</span><span class="modal-field-value">${statusBadge(s.estatus)}</span></div>
            <div class="modal-field"><span class="modal-field-label">Cumplimiento</span><span class="modal-field-value">${cumplimientoHtml(s)}</span></div>
        `;
            document.getElementById("modalOverlay").classList.add("open");
        }

        function closeModal(e) {
            if (e.target === document.getElementById("modalOverlay")) closeModalBtn();
        }

        function closeModalBtn() {
            document.getElementById("modalOverlay").classList.remove("open");
        }

        /* =====================
           EXPORT CSV
           ===================== */
        function exportCSV() {
            const headers = ["Fecha", "Folio", "Tipo", "Modalidad", "Proyecto", "Estatus", "Cumplimiento"];
            const rows = solicitudes.map(s => [
                s.fecha, s.folio, s.tipo, s.modalidad,
                `"${s.proyecto.replace(/"/g, '""')}"`,
                s.estatus, s.cumplimiento || ""
            ].join(","));
            const csv = [headers.join(","), ...rows].join("\n");
            const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url; a.download = "solicitudes_SEA.csv"; a.click();
            showToast("success", "Exportación lista", "El archivo CSV se descargó correctamente.");
        }

        /* =====================
           DESCARGA CERT
           ===================== */
        function descargar(folio) {
            // Redirige a tu endpoint real: window.location.href = `/descargar-certificado/${folio}`;
            showToast("success", "Descargando certificado", `Folio ${folio} — preparando documento.`);
        }

        /* =====================
           TOAST
           ===================== */
        let toastTimer = null;

        function showToast(type, title, desc) {
            const toast = document.getElementById("toast");
            document.getElementById("toastTitle").textContent = title;
            document.getElementById("toastDesc").textContent = desc;
            document.getElementById("toastIcon").textContent = type === "success" ? "✓" : "✕";
            toast.className = `toast ${type} show`;
            clearTimeout(toastTimer);
            toastTimer = setTimeout(hideToast, 4500);
        }

        function hideToast() {
            document.getElementById("toast").classList.remove("show");
        }

        /* =====================
           BOOT
           ===================== */
        init();
    </script>

</body>

</html>
