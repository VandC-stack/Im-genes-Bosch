<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial — GEPI</title>
    <link rel="icon" href="/static/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --yellow: #ECD925;
            --yellow-dark: #c9b800;
            --yellow-light: #fffef5;
            --yellow-bg: rgba(236,217,37,.08);
            --bg: #f2f2f0;
            --surface: #ffffff;
            --surface2: #f7f7f5;
            --border: #e4e4e0;
            --border-dark: #d0d0cc;
            --text: #111111;
            --text-muted: #666;
            --text-dim: #aaa;
            --dark: #1a1a1a;
            --radius: 14px;
            --radius-sm: 8px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── TOPBAR ── */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 32px;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
            position: sticky;
            top: 0;
            z-index: 200;
            box-shadow: 0 1px 4px rgba(0,0,0,.05);
        }
        .topbar-brand {
            display: flex; align-items: center; gap: 10px;
            text-decoration: none; color: inherit;
            transition: opacity .2s;
        }
        .topbar-brand:hover { opacity: .65; }
        .brand-dot {
            width: 28px; height: 28px;
            background: var(--yellow);
            border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
        }
        .brand-dot img { width: 16px; height: 16px; }
        .brand-name {
            font-family: 'Space Mono', monospace;
            font-size: 15px; font-weight: 700; letter-spacing: -.5px;
        }
        .topbar-right { display: flex; align-items: center; gap: 20px; }
        .user-chip {
            display: flex; align-items: center; gap: 8px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 5px 14px 5px 7px;
            font-size: 13px;
        }
        .user-avatar {
            width: 22px; height: 22px;
            background: var(--yellow);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: 700; color: #000;
        }
        .logout-link {
            font-size: 13px; color: var(--text-muted);
            text-decoration: none; transition: color .2s;
        }
        .logout-link:hover { color: var(--dark); }

        /* ── LAYOUT ── */
        .page {
            max-width: 1140px;
            margin: 0 auto;
            padding: 32px 24px 72px;
            width: 100%;
        }

        /* ── BREADCRUMB ── */
        .breadcrumb {
            display: flex; align-items: center; gap: 10px;
            margin-bottom: 28px;
        }
        .back-btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 8px 16px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--surface);
            color: var(--text);
            text-decoration: none;
            font-size: 13px; font-weight: 600;
            transition: all .2s;
        }
        .back-btn:hover { border-color: var(--dark); background: var(--surface2); }
        .breadcrumb .sep { color: var(--text-dim); }
        .breadcrumb .current { font-size: 13px; font-weight: 700; color: var(--dark); }

        /* ── TWO-COLUMN GRID ── */
        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }
        @media (min-width: 900px) {
            .grid {
                grid-template-columns: 320px 1fr;
                align-items: start;
            }
        }

        /* ── CARD ── */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
        }
        .card + .card { margin-top: 16px; }

        .card-head {
            display: flex; align-items: center; gap: 12px;
            padding: 18px 22px;
            border-bottom: 1px solid var(--border);
            background: var(--surface2);
        }
        .card-icon {
            width: 34px; height: 34px;
            background: var(--yellow);
            border-radius: 9px;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; flex-shrink: 0;
        }
        .card-icon.dark { background: var(--dark); }
        .card-icon img { width: 17px; height: 17px; }
        .card-head-title { font-size: 14px; font-weight: 700; }
        .card-head-sub { font-size: 12px; color: var(--text-muted); margin-top: 1px; }

        /* ── SUMMARY ROWS ── */
        .summary-body { padding: 0; }
        .s-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            padding: 12px 22px;
            border-bottom: 1px solid var(--border);
        }
        .s-row:last-child { border-bottom: none; }
        .s-label {
            font-size: 11px;
            font-family: 'Space Mono', monospace;
            text-transform: uppercase;
            letter-spacing: .6px;
            color: var(--text-muted);
            flex-shrink: 0;
            padding-top: 2px;
            min-width: 90px;
        }
        .s-value {
            font-size: 13px; font-weight: 600;
            text-align: right;
            word-break: break-word;
            max-width: 62%;
        }
        .s-content {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 12px 22px;
            border-top: 1px solid var(--border);
        }
        .s-content-label {
            font-size: 11px;
            font-family: 'Space Mono', monospace;
            text-transform: uppercase;
            letter-spacing: .6px;
            color: var(--text-muted);
        }
        .s-content-text {
            font-size: 13px; line-height: 1.6; color: var(--text);
        }

        /* ── BADGES ── */
        .badge {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 3px 9px; border-radius: 999px;
            font-size: 11px; font-weight: 700;
        }
        .badge-dot {
            width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
        }
        .b-finalizado  { background: #dcfce7; color: #166534; }
        .b-finalizado .badge-dot { background: #16a34a; }
        .b-proceso     { background: #fef9c3; color: #854d0e; }
        .b-proceso .badge-dot { background: #ca8a04; }
        .b-pendiente   { background: #fee2e2; color: #991b1b; }
        .b-pendiente .badge-dot { background: #dc2626; }
        .b-cancelado   { background: #f3f4f6; color: #374151; }
        .b-cancelado .badge-dot { background: #6b7280; }
        .b-urgente     { background: #fee2e2; color: #991b1b; }
        .b-regular     { background: #dbeafe; color: #1d4ed8; }

        /* ── PROGRESS TRACKER ── */
        .progress-wrap { padding: 20px 22px; }
        .progress-title {
            font-size: 11px;
            font-family: 'Space Mono', monospace;
            text-transform: uppercase; letter-spacing: .7px;
            color: var(--text-muted);
            margin-bottom: 18px;
        }
        .prog-steps { display: flex; flex-direction: column; gap: 0; }
        .prog-step {
            display: flex; gap: 14px;
            position: relative;
        }
        .prog-step:not(:last-child)::after {
            content: '';
            position: absolute;
            left: 11px; top: 26px;
            width: 2px;
            height: calc(100% - 0px);
            background: var(--border);
            z-index: 0;
        }
        .prog-step.done::after  { background: var(--dark); }
        .prog-step.active::after { background: linear-gradient(to bottom, var(--dark), var(--border)); }

        .prog-node {
            width: 24px; height: 24px;
            border-radius: 50%;
            border: 2px solid var(--border);
            background: var(--surface2);
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; flex-shrink: 0;
            position: relative; z-index: 1;
            margin-top: 2px;
            transition: all .25s;
        }
        .prog-step.done  .prog-node { background: var(--dark); border-color: var(--dark); color: #fff; font-size: 10px; }
        .prog-step.active .prog-node { background: var(--yellow); border-color: var(--yellow-dark); color: #000; font-weight: 700; }

        .prog-body { flex: 1; padding-bottom: 20px; }
        .prog-name { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
        .prog-date { font-size: 11px; color: var(--text-muted); font-family: 'Space Mono', monospace; margin-top: 2px; }

        /* ── RIGHT COLUMN ── */
        .right-col { display: flex; flex-direction: column; gap: 0; }

        /* ── TIMELINE ── */
        .tl-wrap { padding: 20px 22px; }

        /* Filter tabs */
        .tl-filters {
            display: flex; gap: 4px; flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .tl-tab {
            padding: 6px 14px;
            border: 1.5px solid var(--border);
            border-radius: 999px;
            background: transparent;
            font-family: inherit; font-size: 12px; font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: all .18s;
        }
        .tl-tab:hover { border-color: var(--dark); color: var(--dark); }
        .tl-tab.active {
            background: var(--dark);
            border-color: var(--dark);
            color: #fff;
        }

        /* Items */
        .tl-list { display: flex; flex-direction: column; gap: 0; }
        .tl-item {
            display: flex; gap: 14px;
            position: relative;
            animation: fadeUp .3s ease both;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .tl-item:not(:last-child)::after {
            content: '';
            position: absolute;
            left: 15px; top: 34px;
            width: 2px; bottom: 0;
            background: var(--border); z-index: 0;
        }

        .tl-av {
            width: 32px; height: 32px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: 700;
            flex-shrink: 0; position: relative; z-index: 1;
            border: 2px solid var(--surface);
            margin-top: 2px;
        }
        .av-system   { background: var(--dark); color: #fff; font-size: 11px; }
        .av-cliente  { background: var(--yellow); color: #000; }
        .av-agente   { background: #e0f2fe; color: #075985; }
        .av-supervisor { background: #fff8db; color: #8a6a00; }

        .tl-body { flex: 1; padding-bottom: 22px; }
        .tl-meta {
            display: flex; align-items: center; gap: 8px;
            flex-wrap: wrap; margin-bottom: 7px;
        }
        .tl-author { font-size: 13px; font-weight: 700; }
        .tl-role {
            font-size: 10px; font-weight: 600;
            padding: 2px 8px; border-radius: 999px;
            font-family: 'Space Mono', monospace;
        }
        .role-system     { background: #f1f1f1; color: #555; }
        .role-cliente    { background: #fef9c3; color: #854d0e; }
        .role-agente     { background: #e0f2fe; color: #075985; }
        .role-supervisor { background: #fff8db; color: #8a6a00; }
        .tl-time { font-size: 11px; color: var(--text-dim); font-family: 'Space Mono', monospace; margin-left: auto; }

        /* Event box */
        .tl-event {
            display: flex; align-items: flex-start; gap: 10px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 10px 13px;
            font-size: 13px; color: var(--text-muted);
        }
        .tl-event-icon { font-size: 15px; flex-shrink: 0; margin-top: 1px; }
        .tl-event-text { line-height: 1.5; }
        .tl-event-text strong { color: var(--text); }

        .status-change {
            display: inline-flex; align-items: center; gap: 6px;
            margin-top: 5px; font-size: 12px;
        }
        .status-arrow { color: var(--text-dim); }

        /* Comment bubble */
        .tl-comment {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            border-top-left-radius: 3px;
            padding: 11px 13px;
            font-size: 14px; line-height: 1.6;
        }
        .tl-comment.from-cliente {
            background: var(--yellow-light);
            border-color: rgba(236,217,37,.5);
            border-top-right-radius: 3px;
            border-top-left-radius: var(--radius-sm);
        }

        /* Attachments */
        .tl-attachments {
            display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px;
        }
        .tl-attachment {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 4px 10px;
            background: var(--surface2); border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 12px; font-weight: 600; color: var(--text);
            text-decoration: none; transition: all .2s;
        }
        .tl-attachment:hover { border-color: #999; background: var(--surface); }

        /* Empty */
        .tl-empty {
            padding: 48px 22px; text-align: center;
            color: var(--text-muted); font-size: 14px;
        }
        .tl-empty-icon { font-size: 30px; opacity: .3; margin-bottom: 10px; }

        /* ── COMMENT BOX ── */
        .comment-box {
            border-top: 1px solid var(--border);
            padding: 20px 22px;
        }
        .comment-box-title { font-size: 14px; font-weight: 700; margin-bottom: 12px; }
        .comment-textarea {
            width: 100%;
            padding: 11px 13px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--surface2);
            color: var(--text);
            font-family: inherit; font-size: 14px; line-height: 1.6;
            resize: vertical; min-height: 90px;
            transition: border-color .2s, box-shadow .2s;
        }
        .comment-textarea:focus {
            outline: none;
            border-color: var(--yellow-dark);
            box-shadow: 0 0 0 3px rgba(236,217,37,.2);
            background: #fff;
        }
        .comment-footer {
            display: flex; align-items: center; gap: 10px;
            margin-top: 10px; flex-wrap: wrap;
        }
        .btn {
            display: inline-flex; align-items: center; gap: 7px;
            padding: 9px 18px;
            border: none; border-radius: var(--radius-sm);
            font-family: inherit; font-weight: 700; font-size: 13px;
            cursor: pointer; transition: all .18s;
            white-space: nowrap;
        }
        .btn-yellow { background: var(--yellow); color: #000; }
        .btn-yellow:hover { background: var(--yellow-dark); transform: translateY(-1px); }
        .btn-yellow:disabled { opacity: .45; cursor: not-allowed; transform: none; }
        .btn-outline {
            background: transparent; color: var(--text);
            border: 1.5px solid var(--border);
        }
        .btn-outline:hover { border-color: #999; }

        .sending-hint {
            font-size: 12px; color: var(--text-muted);
            margin-left: auto;
            display: none;
        }
        .sending-hint.show { display: block; }

        /* ── TOAST ── */
        .toast {
            position: fixed; bottom: 28px; left: 50%;
            transform: translateX(-50%) translateY(16px);
            display: flex; align-items: center; gap: 14px;
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 14px; font-weight: 600;
            min-width: 270px; max-width: 400px;
            box-shadow: 0 8px 28px rgba(0,0,0,.15);
            opacity: 0; pointer-events: none;
            transition: opacity .28s ease, transform .28s ease;
            z-index: 999;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
        .toast.success { background: #1a1a1a; color: #fff; border-left: 4px solid var(--yellow); }
        .toast.error   { background: #1a1a1a; color: #fff; border-left: 4px solid #e05555; }
        .toast-icon { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 17px; flex-shrink: 0; }
        .toast.success .toast-icon { background: rgba(236,217,37,.15); }
        .toast.error   .toast-icon { background: rgba(224,85,85,.15); }
        .toast-body { flex: 1; }
        .toast-title { font-size: 13px; font-weight: 700; margin-bottom: 1px; }
        .toast-desc  { font-size: 12px; opacity: .65; }
        .toast-close { background: none; border: none; color: #fff; font-size: 18px; cursor: pointer; opacity: .5; padding: 0 2px; line-height: 1; }
        .toast-close:hover { opacity: 1; }

        /* ── RESPONSIVE ── */
        @media (max-width: 899px) {
            .topbar { padding: 12px 16px; }
            .page { padding: 20px 14px 56px; }
            .tl-time { display: none; }
        }

        /* ── SKELETON ── */
        .skel {
            display: inline-block;
            background: linear-gradient(90deg, #e8e8e6 25%, #f2f2f0 50%, #e8e8e6 75%);
            background-size: 200% 100%;
            animation: shimmer 1.4s infinite;
            border-radius: 5px;
        }
        @keyframes shimmer { to { background-position: -200% 0; } }
    </style>
</head>

<body>

    <!-- TOPBAR -->
    <nav class="topbar">
        <a href="{{ back_url }}" class="topbar-brand">
            <div class="brand-dot"><img src="/static/folder.svg" alt=""></div>
            <span class="brand-name">Historial</span>
        </a>
        <div class="topbar-right">
            <div class="user-chip">
                <div class="user-avatar" id="avatarInitial">U</div>
                <span id="usernameDisplay">{{ username }}</span>
            </div>
            <a href="/logout" class="logout-link">Cerrar sesión →</a>
        </div>
    </nav>

    <main class="page">

        <!-- Breadcrumb -->
        <div class="breadcrumb">
            <a href="{{ back_url }}" class="back-btn">← {{ back_label }}</a>
            <span class="sep">›</span>
            <span class="current" id="breadFolio">—</span>
        </div>

        <div class="grid">

            <!-- ═══ LEFT ═══ -->
            <div>

                <!-- Resumen card -->
                <div class="card">
                    <div class="card-head">
                        <div class="card-icon"><img src="/static/document.svg" alt=""></div>
                        <div>
                            <div class="card-head-title" id="headFolio">Cargando…</div>
                            <div class="card-head-sub">Resumen del proyecto</div>
                        </div>
                    </div>
                    <div class="summary-body" id="summaryBody">
                        <!-- skeleton -->
                        <div class="s-row">
                            <span class="skel" style="width:70px;height:12px;"></span>
                            <span class="skel" style="width:100px;height:12px;"></span>
                        </div>
                        <div class="s-row">
                            <span class="skel" style="width:60px;height:12px;"></span>
                            <span class="skel" style="width:120px;height:12px;"></span>
                        </div>
                        <div class="s-row">
                            <span class="skel" style="width:80px;height:12px;"></span>
                            <span class="skel" style="width:90px;height:12px;"></span>
                        </div>
                    </div>
                </div>

                <!-- Etapas card -->
                <div class="card" style="margin-top:16px;">
                    <div class="card-head">
                        <div class="card-icon dark"><img src="/static/Graficas.svg" alt=""></div>
                        <div>
                            <div class="card-head-title">Etapas del proyecto</div>
                        </div>
                    </div>
                    <div class="progress-wrap">
                        <div class="progress-title">Progreso</div>
                        <div class="prog-steps" id="progSteps">
                            <!-- skeleton -->
                            <div class="prog-step">
                                <div class="prog-node"><span class="skel" style="width:10px;height:10px;border-radius:50%;"></span></div>
                                <div class="prog-body"><span class="skel" style="width:100px;height:13px;display:block;"></span></div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>

            <!-- ═══ RIGHT ═══ -->
            <div class="right-col">
                <div class="card">
                    <div class="card-head">
                        <div class="card-icon"><img src="/static/comentarios.svg" alt=""></div>
                        <div>
                            <div class="card-head-title">Historial de actividad</div>
                            <div class="card-head-sub" id="tlSubtitle">Todos los eventos y comentarios</div>
                        </div>
                    </div>

                    <div class="tl-wrap">
                        <!-- Filtros -->
                        <div class="tl-filters" id="tlFilters">
                            <button class="tl-tab active" data-filter="all" onclick="applyFilter('all', this)">Todos</button>
                            <button class="tl-tab" data-filter="evento" onclick="applyFilter('evento', this)">Eventos</button>
                            <button class="tl-tab" data-filter="comentario" onclick="applyFilter('comentario', this)">Comentarios</button>
                        </div>

                        <!-- Timeline -->
                        <div class="tl-list" id="tlList">
                            <div class="tl-empty" id="tlEmpty" style="display:none;">
                                <div class="tl-empty-icon">💬</div>
                                No hay entradas para este filtro.
                            </div>
                        </div>
                    </div>

                    <!-- Caja de comentario -->
                    <div class="comment-box" id="commentBox">
                        <div class="comment-box-title">Agregar comentario</div>
                        <textarea
                            class="comment-textarea"
                            id="commentText"
                            placeholder="Escribe un comentario sobre esta solicitud…"
                            rows="3"
                        ></textarea>
                        <div class="comment-footer">
                            <button class="btn btn-yellow" id="submitCommentBtn" onclick="submitComment()">
                                Enviar comentario
                            </button>
                            <span class="sending-hint" id="sendingHint">Enviando…</span>
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </main>

    <!-- TOAST -->
    <div class="toast" id="toast">
        <div class="toast-icon" id="toastIcon"></div>
        <div class="toast-body">
            <div class="toast-title" id="toastTitle"></div>
            <div class="toast-desc"  id="toastDesc"></div>
        </div>
        <button class="toast-close" onclick="hideToast()">×</button>
    </div>

    <script>
        /* ══════════════════════════════════════
           STATE
        ══════════════════════════════════════ */
        let SOLICITUD   = {};
        let HISTORIAL   = [];
        let ACTIVE_FILTER = "all";
        const FOLIO = window.location.pathname.split("/").filter(Boolean).pop();
        const USERNAME = document.getElementById("usernameDisplay").textContent.trim();

        /* Etapas lineales del proceso — sin "FALTA INFORMACION" como etapa propia */
        const ETAPAS = [
            { key: "PENDIENTE",    label: "Recibida",    icon: "📥" },
            { key: "EN PROCESO",   label: "En proceso",  icon: "⚙️" },
            { key: "FINALIZADO",   label: "Finalizada",  icon: "✅" },
        ];

        /* ══════════════════════════════════════
           INIT
        ══════════════════════════════════════ */
        (function init() {
            // Avatar initial
            if (USERNAME && USERNAME !== "username") {
                document.getElementById("avatarInitial").textContent = USERNAME[0].toUpperCase();
            }

            // Cargar en paralelo
            Promise.all([
                fetch(`/api/solicitud/${FOLIO}`).then(r => r.json()),
                fetch(`/api/solicitud/${FOLIO}/historial`).then(r => r.json())
            ])
            .then(([sol, hist]) => {
                SOLICITUD = sol;
                HISTORIAL = (hist.historial || []).sort((a, b) => {
                    const da = parseDate(a.fecha), db = parseDate(b.fecha);
                    if (da && db) return da - db;   // más antiguo primero
                    return 0;
                });
                renderSummary();
                renderProgress();
                renderTimeline();
            })
            .catch(() => showToast("error", "Error al cargar", "No se pudieron obtener los datos."));
        })();

        /* ══════════════════════════════════════
           SUMMARY
        ══════════════════════════════════════ */
        function renderSummary() {
            const folio = SOLICITUD.folio || "—";
            document.getElementById("breadFolio").textContent = folio;
            document.getElementById("headFolio").textContent  = folio;

            const estatus = SOLICITUD.estatus || "PENDIENTE";
            const statusMap = {
                "FINALIZADO":        ["b-finalizado",  "Finalizado"],
                "EN PROCESO":        ["b-proceso",     "En proceso"],
                "FALTA INFORMACION": ["b-pendiente",   "Falta información"],
                "PENDIENTE":         ["b-pendiente",   "Pendiente"],
                "CANCELADO":         ["b-cancelado",   "Cancelado"],
                "RECHAZADO":         ["b-pendiente",   "Rechazado"],
            };
            const [sCls, sLabel] = statusMap[estatus] || ["b-pendiente", estatus];
            const statusBadge = `<span class="badge ${sCls}"><span class="badge-dot"></span>${sLabel}</span>`;

            const prioLabel = SOLICITUD.prioridad === "urgente"
                ? `<span class="badge b-urgente">🔴 Urgente</span>`
                : `<span class="badge b-regular">🔵 Regular</span>`;

            const cicloText = `Ciclo ${SOLICITUD.ciclo_actual || 1}`;

            // Tabla principal
            const rows = [
                ["Folio",          folio],
                ["Cliente",        SOLICITUD.client || "—"],
                ["Ciclo",          cicloText],
                ["Tipo",           SOLICITUD.tipo_servicio || "—"],
                ["Proyecto",       SOLICITUD.nombre_proyecto || "—"],
                ["Norma",          SOLICITUD.norma || "—"],
                ["SKU / Modelos",  SOLICITUD.num_skus || "—"],
                ["Medidas",        SOLICITUD.medidas || "—"],
                ["Importador",     SOLICITUD.importador || "—"],
                ["Marca",          SOLICITUD.marca || "—"],
                ["País de origen", SOLICITUD.pais_origen || "—"],
                ["Prioridad",      prioLabel],
                ["Estatus",        statusBadge],
                ["Recepción",      formatDate(SOLICITUD.fecha_recepcion)],
                ["Envío",          SOLICITUD.fecha_envio ? formatDate(SOLICITUD.fecha_envio) : "—"],
            ].filter(([, v]) => v && v !== "—");

            const rowsHtml = rows.map(([l, v]) => `
                <div class="s-row">
                    <span class="s-label">${l}</span>
                    <span class="s-value">${v}</span>
                </div>
            `).join("");

            const contenidoHtml = SOLICITUD.contenido ? `
                <div class="s-content">
                    <span class="s-content-label">Descripción / Contenido</span>
                    <p class="s-content-text">${escHtml(SOLICITUD.contenido)}</p>
                </div>` : "";

            document.getElementById("summaryBody").innerHTML = rowsHtml + contenidoHtml;
        }

        /* ══════════════════════════════════════
           PROGRESS
        ══════════════════════════════════════ */
        function renderProgress() {
            const estatus = SOLICITUD.estatus || "PENDIENTE";

            // Si está en FALTA INFORMACION lo tratamos visualmente como "EN PROCESO" para el tracker
            const displayEstatus = estatus === "FALTA INFORMACION" ? "EN PROCESO" : estatus;
            const currentIdx = ETAPAS.findIndex(e => e.key === displayEstatus);

            const el = document.getElementById("progSteps");
            el.innerHTML = ETAPAS.map((etapa, i) => {
                const isDone   = currentIdx >= 0 && i < currentIdx;
                const isActive = currentIdx >= 0 && i === currentIdx;
                const cls = isDone ? "done" : isActive ? "active" : "";

                // Buscamos en el historial cuándo llegó a esta etapa
                const entry = HISTORIAL.find(h => h.estatus_nuevo === etapa.key);
                const dateStr = entry ? `<div class="prog-date">${formatDate(entry.fecha)}</div>` : "";

                const nodeInner = isDone
                    ? `<img src='/static/check.svg' style='width:10px;height:10px;filter:invert(1)'>`
                    : (i + 1);

                // Nota especial cuando estamos en EN PROCESO pero con falta de info
                const warningNote = isActive && estatus === "FALTA INFORMACION"
                    ? `<div style="font-size:11px; color:#991b1b; margin-top:3px;">⚠️ Falta información</div>`
                    : "";

                return `
                    <div class="prog-step ${cls}">
                        <div class="prog-node">${nodeInner}</div>
                        <div class="prog-body">
                            <div class="prog-name">${etapa.icon} ${etapa.label}</div>
                            ${dateStr}
                            ${warningNote}
                        </div>
                    </div>`;
            }).join("");
        }

        /* ══════════════════════════════════════
           TIMELINE
        ══════════════════════════════════════ */
        function renderTimeline() {
            drawTimeline(ACTIVE_FILTER);
        }

        function applyFilter(filter, btn) {
            ACTIVE_FILTER = filter;
            document.querySelectorAll(".tl-tab").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            drawTimeline(filter);
        }

        function drawTimeline(filter) {
            const container = document.getElementById("tlList");
            const empty     = document.getElementById("tlEmpty");

            let data = [...HISTORIAL];
            if (filter !== "all") {
                data = data.filter(h => h.tipo === filter);
            }

            if (data.length === 0) {
                container.innerHTML = "";
                empty.style.display = "block";
                return;
            }
            empty.style.display = "none";

            container.innerHTML = data.map((entry, idx) => {
                const avCls   = avatarClass(entry.rol);
                const roleCls = roleClass(entry.rol);
                const roleText = roleLabel(entry.rol);
                const initial = (entry.autor || "S")[0].toUpperCase();
                const dateStr = formatDate(entry.fecha);

                let contentHtml = "";

                if (entry.tipo === "evento") {
                    let statusChange = "";
                    if (entry.estatus_anterior && entry.estatus_nuevo) {
                        statusChange = `
                            <div class="status-change">
                                <span class="badge ${badgeClass(entry.estatus_anterior)}">${statusLabel(entry.estatus_anterior)}</span>
                                <span class="status-arrow">→</span>
                                <span class="badge ${badgeClass(entry.estatus_nuevo)}">${statusLabel(entry.estatus_nuevo)}</span>
                            </div>`;
                    }
                    const icon = (typeof entry.icono === "string" && entry.icono.length <= 4) ? entry.icono : "🔔";
                    contentHtml = `
                        <div class="tl-event">
                            <span class="tl-event-icon">${icon}</span>
                            <div class="tl-event-text">${escHtml(entry.texto)}${statusChange}</div>
                        </div>`;
                } else {
                    const isCliente = (entry.rol || "").toLowerCase() === "cliente";
                    const attachHtml = buildAttachments(entry.archivos || []);
                    contentHtml = `
                        <div class="tl-comment ${isCliente ? "from-cliente" : ""}">
                            ${escHtml(entry.texto)}
                            ${attachHtml}
                        </div>`;
                }

                return `
                    <div class="tl-item" style="animation-delay:${idx * 0.03}s">
                        <div class="tl-av ${avCls}">${initial}</div>
                        <div class="tl-body">
                            <div class="tl-meta">
                                <span class="tl-author">${escHtml(entry.autor)}</span>
                                <span class="tl-role ${roleCls}">${roleText}</span>
                                <span class="tl-time">${dateStr}</span>
                            </div>
                            ${contentHtml}
                        </div>
                    </div>`;
            }).join("");
        }

        function buildAttachments(archivos) {
            if (!archivos || archivos.length === 0) return "";
            const chips = archivos.map(a => {
                const url = a.url || "#";
                const nombre = a.nombre || "Archivo";
                return `<a href="${url}" class="tl-attachment" target="_blank">📎 ${escHtml(nombre)}</a>`;
            }).join("");
            return `<div class="tl-attachments">${chips}</div>`;
        }

        /* ══════════════════════════════════════
           COMMENT SUBMIT
        ══════════════════════════════════════ */
        async function submitComment() {
            const textarea = document.getElementById("commentText");
            const btn      = document.getElementById("submitCommentBtn");
            const hint     = document.getElementById("sendingHint");
            const texto    = textarea.value.trim();

            if (!texto) {
                showToast("error", "Comentario vacío", "Escribe algo antes de enviar.");
                return;
            }

            btn.disabled = true;
            hint.classList.add("show");

            try {
                const res = await fetch(`/api/solicitud/${FOLIO}/comentarios`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ texto })
                });
                const data = await res.json();

                if (!res.ok) {
                    showToast("error", "Error al enviar", data.error || "Intenta de nuevo.");
                    return;
                }

                textarea.value = "";
                showToast("success", "Comentario enviado", "El comentario fue registrado.");

                // Recargar historial
                const hist = await fetch(`/api/solicitud/${FOLIO}/historial`).then(r => r.json());
                HISTORIAL = (hist.historial || []).sort((a, b) => {
                    const da = parseDate(a.fecha), db = parseDate(b.fecha);
                    return (da && db) ? da - db : 0;
                });
                drawTimeline(ACTIVE_FILTER);

            } catch {
                showToast("error", "Error de red", "No se pudo conectar.");
            } finally {
                btn.disabled = false;
                hint.classList.remove("show");
            }
        }

        /* ══════════════════════════════════════
           HELPERS
        ══════════════════════════════════════ */
        function parseDate(value) {
            if (!value) return null;
            const text = String(value).trim();
            const normalized = text.includes("T") ? text.replace(/\.(\d{3})\d+/, ".$1") : text.replace(" ", "T");
            const d = new Date(normalized);
            return isNaN(d.getTime()) ? null : d;
        }

        function formatDate(value) {
            const d = parseDate(value);
            if (!d) return value || "—";
            return d.toLocaleString("es-MX", {
                year: "numeric", month: "2-digit", day: "2-digit",
                hour: "2-digit", minute: "2-digit", hour12: false
            });
        }

        function escHtml(str) {
            if (!str) return "";
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
        }

        function avatarClass(rol) {
            return { system: "av-system", cliente: "av-cliente", agente: "av-agente",
                     ejecutivo: "av-agente", bosch: "av-agente", supervisor: "av-supervisor" }[rol] || "av-agente";
        }
        function roleClass(rol) {
            return { system: "role-system", cliente: "role-cliente", agente: "role-agente",
                     ejecutivo: "role-agente", bosch: "role-agente", supervisor: "role-supervisor" }[rol] || "role-agente";
        }
        function roleLabel(rol) {
            return { system: "Sistema", cliente: "Cliente", agente: "Agente",
                     ejecutivo: "Ejecutivo", bosch: "Bosch", supervisor: "Supervisor" }[rol] || rol;
        }
        function badgeClass(estatus) {
            return { "FINALIZADO": "b-finalizado", "EN PROCESO": "b-proceso",
                     "FALTA INFORMACION": "b-pendiente", "PENDIENTE": "b-pendiente",
                     "CANCELADO": "b-cancelado", "RECHAZADO": "b-pendiente" }[estatus] || "b-pendiente";
        }
        function statusLabel(estatus) {
            return { "FALTA INFORMACION": "Falta información" }[estatus] || estatus;
        }

        /* ── TOAST ── */
        let toastTimer = null;
        function showToast(type, title, desc) {
            const t = document.getElementById("toast");
            document.getElementById("toastTitle").textContent = title;
            document.getElementById("toastDesc").textContent  = desc;
            document.getElementById("toastIcon").innerHTML = type === "success"
                ? "<img src='/static/check.svg' style='width:18px;height:18px;filter:invert(1);'>"
                : "✕";
            t.className = `toast ${type} show`;
            clearTimeout(toastTimer);
            toastTimer = setTimeout(hideToast, 4500);
        }
        function hideToast() { document.getElementById("toast").classList.remove("show"); }
    </script>

</body>
