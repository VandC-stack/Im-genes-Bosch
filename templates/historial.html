<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial — GEPI</title>
    <link rel="icon" href="/static/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Space+Mono:wght@400;700&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --yellow: #ECD925;
            --yellow-dark: #c9b800;
            --yellow-light: #fffef5;
            --yellow-bg: rgba(236, 217, 37, .08);
            --bg: #f0f0f0;
            --surface: #ffffff;
            --surface2: #f6f6f6;
            --border: #e4e4e0;
            --border-dark: #d0d0cc;
            --text: #111111;
            --text-muted: #666;
            --text-dim: #aaa;
            --dark: #1a1a1a;
            --radius: 14px;
            --radius-sm: 8px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── TOPBAR ── */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 32px;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
            position: sticky;
            top: 0;
            z-index: 200;
            box-shadow: 0 1px 6px rgba(0, 0, 0, .06);
        }

        .topbar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: inherit;
            transition: opacity .2s;
        }

        .topbar-brand:hover {
            opacity: .65;
        }

        .brand-dot {
            width: 28px;
            height: 28px;
            background: var(--yellow);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brand-dot img {
            width: 16px;
            height: 16px;
        }

        .brand-name {
            font-family: 'Space Mono', monospace;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: -.5px;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .user-chip {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 6px 14px 6px 8px;
            font-size: 13px;
        }

        .user-avatar {
            width: 24px;
            height: 24px;
            background: var(--yellow);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            color: #000;
        }

        .logout-link {
            font-size: 13px;
            color: var(--text-muted);
            text-decoration: none;
            transition: color .2s;
        }

        .logout-link:hover {
            color: var(--dark);
        }

        /* ── LAYOUT ── */
        .page {
            max-width: 1140px;
            margin: 0 auto;
            padding: 32px 24px 72px;
            width: 100%;
        }

        /* ── BREADCRUMB ── */
        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 28px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--surface);
            color: var(--text);
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: all .2s;
        }

        .back-btn:hover {
            border-color: var(--dark);
            background: var(--surface2);
        }

        .breadcrumb .sep {
            color: var(--text-dim);
        }

        .breadcrumb .current {
            font-size: 13px;
            font-weight: 700;
            color: var(--dark);
        }

        /* ── TWO-COLUMN GRID ── */
        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 900px) {
            .grid {
                grid-template-columns: 300px 1fr;
                align-items: start;
            }
        }

        /* ── CARD ── */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
        }

        .card+.card {
            margin-top: 16px;
        }

        .card-head {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 18px 22px;
            border-bottom: 1px solid var(--border);
            background: var(--surface2);
        }

        .card-icon {
            width: 34px;
            height: 34px;
            background: var(--yellow);
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        .card-icon img {
            width: 17px;
            height: 17px;
        }

        .card-head-title {
            font-size: 14px;
            font-weight: 700;
        }

        .card-head-sub {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 1px;
        }

        /* ── SUMMARY ROWS ── */
        .summary-body {
            padding: 0;
        }

        .s-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            padding: 12px 22px;
            border-bottom: 1px solid var(--border);
        }

        .s-row:last-child {
            border-bottom: none;
        }

        .s-label {
            font-size: 11px;
            font-family: 'Space Mono', monospace;
            text-transform: uppercase;
            letter-spacing: .6px;
            color: var(--text-muted);
            flex-shrink: 0;
            padding-top: 2px;
            min-width: 90px;
        }

        .s-value {
            font-size: 13px;
            font-weight: 600;
            text-align: right;
            word-break: break-word;
            max-width: 62%;
        }

        .s-content {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 12px 22px;
            border-top: 1px solid var(--border);
        }

        .s-content-label {
            font-size: 11px;
            font-family: 'Space Mono', monospace;
            text-transform: uppercase;
            letter-spacing: .6px;
            color: var(--text-muted);
        }

        .s-content-text {
            font-size: 13px;
            line-height: 1.6;
            color: var(--text);
        }

        /* ── BADGES ── */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 9px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
        }

        .badge-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .b-finalizado {
            background: #dcfce7;
            color: #166534;
        }

        .b-finalizado .badge-dot {
            background: #16a34a;
        }

        .b-proceso {
            background: #fef9c3;
            color: #854d0e;
        }

        .b-proceso .badge-dot {
            background: #ca8a04;
        }

        .b-pendiente {
            background: #fee2e2;
            color: #991b1b;
        }

        .b-pendiente .badge-dot {
            background: #dc2626;
        }

        .b-cancelado {
            background: #f3f4f6;
            color: #374151;
        }

        .b-cancelado .badge-dot {
            background: #6b7280;
        }

        .b-urgente {
            background: #fee2e2;
            color: #991b1b;
        }

        .b-regular {
            background: #dbeafe;
            color: #1d4ed8;
        }

        /* ── CYCLE COUNTER CARD ── */
        .cycle-card {
            background: var(--dark);
            border: 1px solid #2a2a2a;
            border-radius: var(--radius);
            padding: 28px 22px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .cycle-number {
            font-family: 'Space Mono', monospace;
            font-size: 72px;
            font-weight: 700;
            color: var(--yellow);
            line-height: 1;
            flex-shrink: 0;
            letter-spacing: -3px;
        }

        .cycle-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .cycle-label {
            font-family: 'Space Mono', monospace;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .8px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, .4);
        }

        .cycle-sublabel {
            font-size: 15px;
            font-weight: 700;
            color: #fff;
        }

        .cycle-folio {
            font-size: 12px;
            color: rgba(255, 255, 255, .4);
            font-family: 'Space Mono', monospace;
            margin-top: 4px;
        }

        /* ── TIMELINE ── */
        .tl-wrap {
            padding: 22px;
        }

        .tl-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tl-count-chip {
            font-family: 'Space Mono', monospace;
            font-size: 11px;
            font-weight: 700;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 4px 12px;
            color: var(--text-muted);
        }

        /* Items */
        .tl-list {
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .tl-item {
            display: flex;
            gap: 14px;
            position: relative;
            animation: fadeUp .3s ease both;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .tl-item:not(:last-child)::after {
            content: '';
            position: absolute;
            left: 15px;
            top: 36px;
            width: 2px;
            bottom: 0;
            background: var(--border);
            z-index: 0;
        }

        .tl-dot {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            flex-shrink: 0;
            position: relative;
            z-index: 1;
            border: 2px solid var(--surface);
            margin-top: 2px;
        }

        .dot-new {
            background: #dcfce7;
            border-color: #bbf7d0;
        }

        .dot-replace {
            background: #fef9c3;
            border-color: #fde68a;
        }

        .dot-cycle {
            background: var(--dark);
            border-color: var(--dark);
        }

        .tl-body {
            flex: 1;
            padding-bottom: 22px;
        }

        .tl-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 7px;
        }

        .tl-author {
            font-size: 13px;
            font-weight: 700;
        }

        .tl-time {
            font-size: 11px;
            color: var(--text-dim);
            font-family: 'Space Mono', monospace;
            margin-left: auto;
        }

        /* Event cards */
        .tl-event {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px 14px;
            font-size: 13px;
        }

        .tl-event-top {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .event-type-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 9px;
            border-radius: 999px;
            font-size: 10px;
            font-weight: 700;
            font-family: 'Space Mono', monospace;
            text-transform: uppercase;
            letter-spacing: .4px;
        }

        .et-new {
            background: #dcfce7;
            color: #166534;
        }

        .et-replace {
            background: #fef9c3;
            color: #854d0e;
        }

        .et-cycle {
            background: var(--dark);
            color: var(--yellow);
        }

        .tl-event-desc {
            font-size: 13px;
            color: var(--text);
            font-weight: 500;
            line-height: 1.5;
        }

        .tl-event-desc span {
            color: var(--text-muted);
            font-weight: 400;
        }

        /* Attachments */
        .tl-attachments {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px;
        }

        .tl-attachment {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 11px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 7px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text);
            text-decoration: none;
            transition: all .2s;
        }

        .tl-attachment:hover {
            border-color: #999;
            background: var(--surface2);
            box-shadow: 0 2px 8px rgba(0, 0, 0, .06);
        }

        .tl-attachment-icon {
            font-size: 13px;
        }

        /* Empty */
        .tl-empty {
            padding: 56px 22px;
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
        }

        .tl-empty-icon {
            font-size: 32px;
            opacity: .25;
            margin-bottom: 10px;
        }

        /* ── TOAST ── */
        .toast {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%) translateY(16px);
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            min-width: 270px;
            max-width: 400px;
            box-shadow: 0 8px 28px rgba(0, 0, 0, .15);
            opacity: 0;
            pointer-events: none;
            transition: opacity .28s ease, transform .28s ease;
            z-index: 999;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
            pointer-events: auto;
        }

        .toast.success {
            background: #1a1a1a;
            color: #fff;
            border-left: 4px solid var(--yellow);
        }

        .toast.error {
            background: #1a1a1a;
            color: #fff;
            border-left: 4px solid #e05555;
        }

        .toast-icon {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            flex-shrink: 0;
        }

        .toast.success .toast-icon {
            background: rgba(236, 217, 37, .15);
        }

        .toast.error .toast-icon {
            background: rgba(224, 85, 85, .15);
        }

        .toast-body {
            flex: 1;
        }

        .toast-title {
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 1px;
        }

        .toast-desc {
            font-size: 12px;
            opacity: .65;
        }

        .toast-close {
            background: none;
            border: none;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            opacity: .5;
            padding: 0 2px;
            line-height: 1;
        }

        .toast-close:hover {
            opacity: 1;
        }

        /* ── SKELETON ── */
        .skel {
            display: inline-block;
            background: linear-gradient(90deg, #e8e8e6 25%, #f2f2f0 50%, #e8e8e6 75%);
            background-size: 200% 100%;
            animation: shimmer 1.4s infinite;
            border-radius: 5px;
        }

        @keyframes shimmer {
            to {
                background-position: -200% 0;
            }
        }

        /* ── RESPONSIVE ── */
        @media (max-width: 899px) {
            .topbar {
                padding: 12px 16px;
            }

            .page {
                padding: 20px 14px 56px;
            }

            .tl-time {
                display: none;
            }

            .cycle-number {
                font-size: 56px;
            }
        }
    </style>
</head>

<body>

    <!-- TOPBAR -->
    <nav class="topbar">
        <a href="{{ back_url }}" class="topbar-brand">
            <div class="brand-dot"><img src="/static/folder.svg" alt=""></div>
            <span class="brand-name">Historial</span>
        </a>
        <div class="topbar-right">
            <div class="user-chip">
                <div class="user-avatar" id="avatarInitial">U</div>
                <span id="usernameDisplay">{{ username }}</span>
            </div>
            <a href="/logout" class="logout-link">Cerrar sesión →</a>
        </div>
    </nav>

    <main class="page">

        <!-- Breadcrumb -->
        <div class="breadcrumb">
            <a href="{{ back_url }}" class="back-btn">← {{ back_label }}</a>
            <span class="sep">›</span>
            <span class="current" id="breadFolio">—</span>
        </div>

        <div class="grid">

            <!-- ═══ LEFT ═══ -->
            <div>

                <!-- Contador de ciclo -->
                <div class="cycle-card">
                    <div class="cycle-number" id="cycleNumber">—</div>
                    <div class="cycle-info">
                        <div class="cycle-label">Ciclo actual</div>
                        <div class="cycle-sublabel" id="cycleSublabel">Cargando…</div>
                        <div class="cycle-folio" id="cycleFolio"></div>
                    </div>
                </div>

                <!-- Resumen del proyecto -->
                <div class="card" style="margin-top:16px;">
                    <div class="card-head">
                        <div class="card-icon"><img src="/static/document.svg" alt=""></div>
                        <div>
                            <div class="card-head-title" id="headFolio">Cargando…</div>
                            <div class="card-head-sub">Resumen del proyecto</div>
                        </div>
                    </div>
                    <div class="summary-body" id="summaryBody">
                        <div class="s-row">
                            <span class="skel" style="width:70px;height:12px;"></span>
                            <span class="skel" style="width:100px;height:12px;"></span>
                        </div>
                        <div class="s-row">
                            <span class="skel" style="width:60px;height:12px;"></span>
                            <span class="skel" style="width:120px;height:12px;"></span>
                        </div>
                        <div class="s-row">
                            <span class="skel" style="width:80px;height:12px;"></span>
                            <span class="skel" style="width:90px;height:12px;"></span>
                        </div>
                    </div>
                </div>

            </div>

            <!-- ═══ RIGHT ═══ -->
            <div>
                <div class="card">
                    <div class="card-head">
                        <div class="card-icon"><img src="/static/comentarios.svg" alt=""></div>
                        <div>
                            <div class="card-head-title">Historial de archivos</div>
                            <div class="card-head-sub" id="tlSubtitle">Imágenes y archivos del proyecto</div>
                        </div>
                    </div>

                    <div class="tl-wrap">

                        <div class="tl-header-row">
                            <span class="tl-count-chip" id="tlCountChip">0 entradas</span>
                        </div>

                        <div class="tl-list" id="tlList">
                            <div class="tl-empty" id="tlEmpty" style="display:none;">
                                <div class="tl-empty-icon">🗂️</div>
                                No hay archivos registrados aún.
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>

    </main>

    <!-- TOAST -->
    <div class="toast" id="toast">
        <div class="toast-icon" id="toastIcon"></div>
        <div class="toast-body">
            <div class="toast-title" id="toastTitle"></div>
            <div class="toast-desc" id="toastDesc"></div>
        </div>
        <button class="toast-close" onclick="hideToast()">×</button>
    </div>

    <script>
        /* ══════════════════════════════════════
           STATE
        ══════════════════════════════════════ */
        let SOLICITUD = {};
        let HISTORIAL = [];
        const FOLIO = window.location.pathname.split("/").filter(Boolean).pop();
        const USERNAME = document.getElementById("usernameDisplay").textContent.trim();

        /* ══════════════════════════════════════
           INIT
        ══════════════════════════════════════ */
        (function init() {
            if (USERNAME && USERNAME !== "username") {
                document.getElementById("avatarInitial").textContent = USERNAME[0].toUpperCase();
            }

            Promise.all([
                fetch(`/api/solicitud/${FOLIO}`).then(r => r.json()),
                fetch(`/api/solicitud/${FOLIO}/historial`).then(r => r.json())
            ])
                .then(([sol, hist]) => {
                    SOLICITUD = sol;
                    HISTORIAL = (hist.historial || []).sort((a, b) => {
                        const da = parseDate(a.fecha), db = parseDate(b.fecha);
                        return (da && db) ? da - db : 0;
                    });
                    renderCycle();
                    renderSummary();
                    renderTimeline();
                })
                .catch(() => showToast("error", "Error al cargar", "No se pudieron obtener los datos."));
        })();

        /* ══════════════════════════════════════
           CYCLE COUNTER
        ══════════════════════════════════════ */
        function renderCycle() {
            const ciclo = SOLICITUD.ciclo_actual || 1;
            const folio = SOLICITUD.folio || "—";
            document.getElementById("cycleNumber").textContent = ciclo;
            document.getElementById("cycleSublabel").textContent =
                ciclo === 1 ? "Primera entrega" : `Actualización ${ciclo}`;
            document.getElementById("cycleFolio").textContent = `Folio ${folio}`;
        }

        /* ══════════════════════════════════════
           SUMMARY
        ══════════════════════════════════════ */
        function renderSummary() {
            const folio = SOLICITUD.folio || "—";
            document.getElementById("breadFolio").textContent = folio;
            document.getElementById("headFolio").textContent = folio;

            const estatus = SOLICITUD.estatus || "PENDIENTE";
            const statusMap = {
                "FINALIZADO": ["b-finalizado", "Finalizado"],
                "EN PROCESO": ["b-proceso", "En proceso"],
                "FALTA INFORMACION": ["b-pendiente", "Falta información"],
                "PENDIENTE": ["b-pendiente", "Pendiente"],
                "CANCELADO": ["b-cancelado", "Cancelado"],
                "RECHAZADO": ["b-pendiente", "Rechazado"],
            };
            const [sCls, sLabel] = statusMap[estatus] || ["b-pendiente", estatus];
            const statusBadge = `<span class="badge ${sCls}"><span class="badge-dot"></span>${sLabel}</span>`;

            const prioLabel = SOLICITUD.prioridad === "urgente"
                ? `<span class="badge b-urgente">🔴 Urgente</span>`
                : `<span class="badge b-regular">🔵 Regular</span>`;

            const rows = [
                ["Folio", folio],
                ["Cliente", SOLICITUD.client || "—"],
                ["Tipo", SOLICITUD.tipo_servicio || "—"],
                ["Proyecto", SOLICITUD.nombre_proyecto || "—"],
                ["Norma", SOLICITUD.norma || "—"],
                ["SKU / Modelos", SOLICITUD.num_skus || "—"],
                ["Medidas", SOLICITUD.medidas || "—"],
                ["Importador", SOLICITUD.importador || "—"],
                ["Marca", SOLICITUD.marca || "—"],
                ["País de origen", SOLICITUD.pais_origen || "—"],
                ["Prioridad", prioLabel],
                ["Estatus", statusBadge],
                ["Recepción", formatDate(SOLICITUD.fecha_recepcion)],
                ["Envío", SOLICITUD.fecha_envio ? formatDate(SOLICITUD.fecha_envio) : "—"],
            ].filter(([, v]) => v && v !== "—");

            const rowsHtml = rows.map(([l, v]) => `
                <div class="s-row">
                    <span class="s-label">${l}</span>
                    <span class="s-value">${v}</span>
                </div>
            `).join("");

            const contenidoHtml = SOLICITUD.contenido ? `
                <div class="s-content">
                    <span class="s-content-label">Descripción / Contenido</span>
                    <p class="s-content-text">${escHtml(SOLICITUD.contenido)}</p>
                </div>` : "";

            document.getElementById("summaryBody").innerHTML = rowsHtml + contenidoHtml;
        }

        /* ══════════════════════════════════════
           TIMELINE — solo archivos/imágenes
        ══════════════════════════════════════ */
        function renderTimeline() {
            const container = document.getElementById("tlList");
            const empty = document.getElementById("tlEmpty");

            // Filtrar: solo eventos de tipo imagen/archivo nuevo, reemplazo, o actualización de ciclo
            const fileTypes = ["imagen_nueva", "archivo_nuevo", "imagen_reemplazada", "archivo_reemplazado", "ciclo_actualizado"];
            const data = HISTORIAL.filter(h => {
                const t = (h.tipo || "").toLowerCase();
                const sub = (h.subtipo || "").toLowerCase();
                return fileTypes.includes(t) || fileTypes.includes(sub)
                    || t === "archivo" || t === "imagen"
                    || (t === "evento" && (
                        sub.includes("imagen") || sub.includes("archivo") ||
                        sub.includes("ciclo") ||
                        (h.texto || "").toLowerCase().includes("imagen") ||
                        (h.texto || "").toLowerCase().includes("archivo") ||
                        (h.texto || "").toLowerCase().includes("ciclo") ||
                        (h.archivos && h.archivos.length > 0)
                    ));
            });

            document.getElementById("tlCountChip").textContent =
                data.length === 1 ? "1 entrada" : `${data.length} entradas`;

            if (data.length === 0) {
                container.innerHTML = "";
                empty.style.display = "block";
                return;
            }
            empty.style.display = "none";

            container.innerHTML = data.map((entry, idx) => {
                const dateStr = formatDate(entry.fecha);
                const autor = entry.autor || "Sistema";

                // Determinar tipo visual
                const tipo = (entry.tipo || entry.subtipo || "").toLowerCase();
                const texto = (entry.texto || "").toLowerCase();

                let dotClass = "dot-new";
                let badgeClass = "et-new";
                let badgeLabel = "Archivo nuevo";
                let dotIcon = "📄";

                if (tipo.includes("reemplaz") || texto.includes("reemplaz")) {
                    dotClass = "dot-replace"; badgeClass = "et-replace";
                    badgeLabel = "Reemplazo"; dotIcon = "🔄";
                } else if (tipo.includes("ciclo") || texto.includes("ciclo")) {
                    dotClass = "dot-cycle"; badgeClass = "et-cycle";
                    badgeLabel = "Nuevo ciclo"; dotIcon = "🔁";
                } else if (tipo.includes("imagen") || texto.includes("imagen")) {
                    dotClass = "dot-new"; badgeClass = "et-new";
                    badgeLabel = "Imagen nueva"; dotIcon = "🖼️";
                }

                const attachHtml = buildAttachments(entry.archivos || []);

                return `
                    <div class="tl-item" style="animation-delay:${idx * 0.04}s">
                        <div class="tl-dot ${dotClass}">${dotIcon}</div>
                        <div class="tl-body">
                            <div class="tl-meta">
                                <span class="tl-author">${escHtml(autor)}</span>
                                <span class="tl-time">${dateStr}</span>
                            </div>
                            <div class="tl-event">
                                <div class="tl-event-top">
                                    <span class="event-type-badge ${badgeClass}">${badgeLabel}</span>
                                </div>
                                <div class="tl-event-desc">
                                    ${escHtml(entry.texto || "")}
                                </div>
                                ${attachHtml}
                            </div>
                        </div>
                    </div>`;
            }).join("");
        }

        function buildAttachments(archivos) {
            if (!archivos || archivos.length === 0) return "";
            const chips = archivos.map(a => {
                const url = a.url || "#";
                const nombre = a.nombre || "Archivo";
                const ext = nombre.split(".").pop().toLowerCase();
                const isImg = ["jpg", "jpeg", "png", "gif", "webp", "svg"].includes(ext);
                const icon = isImg ? "🖼️" : "📎";
                return `<a href="${url}" class="tl-attachment" target="_blank">
                    <span class="tl-attachment-icon">${icon}</span>${escHtml(nombre)}
                </a>`;
            }).join("");
            return `<div class="tl-attachments">${chips}</div>`;
        }

        /* ══════════════════════════════════════
           HELPERS
        ══════════════════════════════════════ */
        function parseDate(value) {
            if (!value) return null;
            const text = String(value).trim();
            const normalized = text.includes("T") ? text.replace(/\.(\d{3})\d+/, ".$1") : text.replace(" ", "T");
            const d = new Date(normalized);
            return isNaN(d.getTime()) ? null : d;
        }

        function formatDate(value) {
            const d = parseDate(value);
            if (!d) return value || "—";
            return d.toLocaleString("es-MX", {
                year: "numeric", month: "2-digit", day: "2-digit",
                hour: "2-digit", minute: "2-digit", hour12: false
            });
        }

        function escHtml(str) {
            if (!str) return "";
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
        }

        /* ── TOAST ── */
        let toastTimer = null;
        function showToast(type, title, desc) {
            const t = document.getElementById("toast");
            document.getElementById("toastTitle").textContent = title;
            document.getElementById("toastDesc").textContent = desc;
            document.getElementById("toastIcon").innerHTML = type === "success"
                ? "<img src='/static/check.svg' style='width:18px;height:18px;filter:invert(1);'>"
                : "✕";
            t.className = `toast ${type} show`;
            clearTimeout(toastTimer);
            toastTimer = setTimeout(hideToast, 4500);
        }
        function hideToast() { document.getElementById("toast").classList.remove("show"); }
    </script>
