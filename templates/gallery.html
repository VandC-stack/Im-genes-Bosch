<!--====================================================================================================
    # Vista de la galeria del folio
    #====================================================================================================-->
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Archivos</title>
    <link rel="icon" href="/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --yellow: #ECD925;
            --yellow-dark: #c9b800;
            --yellow-light: #fffef5;
            --bg: #f0f0f0;
            --surface: #ffffff;
            --surface2: #f6f6f6;
            --border: #e0e0e0;
            --text: #111111;
            --text-muted: #666;
            --text-dim: #aaa;
            --dark: #1a1a1a;
            --danger: #cc3333;
            --success: #2a9d5c;
            --radius: 14px;
            --radius-sm: 8px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* ── TOPBAR ── */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 32px;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 1px 6px rgba(0, 0, 0, 0.06);
        }

        .topbar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-dot {
            width: 28px;
            height: 28px;
            background: var(--yellow);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            color: #000;
        }

        .brand-name {
            font-family: 'Space Mono', monospace;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text);
        }

        .brand-folio {
            font-family: 'Space Mono', monospace;
            font-size: 11px;
            color: var(--text-muted);
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 4px 10px;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-chip {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #fff;
            border: 1.5px solid #d4d4d4;
            border-radius: 999px;
            padding: 6px 12px 6px 8px;
            font-size: 13px;
            color: var(--text);
            min-width: 120px;
        }

        .user-avatar {
            width: 24px;
            height: 24px;
            background: var(--yellow);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            color: #000;
        }

        .user-name {
            font-weight: 700;
            color: #1a1a1a;
            max-width: 170px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .topbar-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 34px;
            padding: 7px 12px;
            border-radius: 999px;
            border: 1.5px solid #d4d4d4;
            background: #fff;
            font-size: 13px;
            font-weight: 700;
            color: #323232;
            text-decoration: none;
            transition: border-color 0.2s, background 0.2s, color 0.2s;
        }

        .topbar-link:hover {
            border-color: #bcbcbc;
            background: var(--surface2);
            color: #111;
        }

        /* ── PAGE ── */
        .page {
            max-width: 1800px;
            margin: 0 auto;
            padding: 36px 32px 60px;
        }

        /* ── STATS BAR ── */
        .stats-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 24px;
            align-items: center;
        }

        .stat-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 12px;
            font-family: 'Space Mono', monospace;
            font-weight: 400;
            border: 1.5px solid var(--border);
            background: var(--surface);
            color: var(--text-muted);
        }

        .stat-pill strong {
            font-weight: 700;
            color: var(--dark);
        }

        /* ── GALLERY GRID ── */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 16px;
            margin-bottom: 32px;
        }

        @media (max-width: 1400px) {
            .gallery-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        @media (max-width: 1100px) {
            .gallery-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 768px) {
            .gallery-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 480px) {
            .gallery-grid {
                grid-template-columns: 1fr;
            }
        }

        /* ── CARD ── */
        .image-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            transition: box-shadow 0.2s, transform 0.2s, border-color 0.2s;
            aspect-ratio: 1;
            position: relative;
            cursor: default;
        }

        .image-card:hover {
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.1);
            transform: translateY(-3px);
            border-color: #ccc;
        }

        .image-preview-container {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            background: var(--surface2);
        }

        .image-preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.35s ease;
        }

        .image-card:hover .image-preview {
            transform: scale(1.04);
        }

        .file-preview {
            width: 100%;
            height: 100%;
            background: var(--yellow-light);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .file-preview-icon-img {
            width: 56px;
            height: 56px;
            object-fit: contain;
            opacity: 0.94;
        }

        .file-preview-ext {
            font-family: 'Space Mono', monospace;
            font-size: 12px;
            font-weight: 700;
            color: var(--yellow-dark);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            padding: 3px 10px;
            border: 1.5px solid var(--yellow-dark);
            border-radius: 4px;
        }

        .pdf-preview-frame {
            width: 100%;
            height: 100%;
            border: none;
            pointer-events: none;
            background: #fff;
        }

        /* Info overlay — bottom, on hover */
        .image-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 36px 14px 54px;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.75) 0%, rgba(0, 0, 0, 0.35) 55%, transparent 100%);
            opacity: 0;
            transition: opacity 0.25s;
            pointer-events: none;
        }

        .image-card:hover .image-overlay {
            opacity: 1;
        }

        .overlay-name {
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .overlay-meta {
            font-family: 'Space Mono', monospace;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 2px;
        }

        /* Status badge — top-right, always visible */
        .status-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
            z-index: 2;
            pointer-events: none;
            white-space: nowrap;
        }

        .badge-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        /* Match dashboard badge colors exactly */
        .status-pending {
            background: #fef9c3;
            color: #854d0e;
        }

        .status-pending .badge-dot {
            background: #ca8a04;
        }

        .status-accepted {
            background: #dcfce7;
            color: #166534;
        }

        .status-accepted .badge-dot {
            background: #16a34a;
        }

        .status-rejected {
            background: #fee2e2;
            color: #991b1b;
        }

        .status-rejected .badge-dot {
            background: #dc2626;
        }

        .status-revision {
            background: #e0f2fe;
            color: #075985;
        }

        .status-revision .badge-dot {
            background: #0284c7;
        }

        /* Action buttons — bottom strip, slide up on hover */
        .card-actions {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            display: grid;
            grid-template-columns: 1fr 1fr;
            opacity: 0;
            transform: translateY(6px);
            transition: opacity 0.22s, transform 0.22s;
            z-index: 3;
        }

        .image-card:hover .card-actions {
            opacity: 1;
            transform: translateY(0);
        }

        .action-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            padding: 10px 0;
            font-family: 'DM Sans', sans-serif;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            letter-spacing: 0.02em;
            transition: background 0.15s;
        }

        .action-btn svg {
            width: 12px;
            height: 12px;
            flex-shrink: 0;
        }

        .action-accept {
            background: rgba(220, 252, 231, 0.92);
            color: #166534;
            border-right: 1px solid rgba(0, 0, 0, 0.06);
        }

        .action-accept:hover {
            background: rgba(187, 247, 208, 0.97);
        }

        .action-reject {
            background: rgba(254, 226, 226, 0.92);
            color: #991b1b;
        }

        .action-reject:hover {
            background: rgba(252, 165, 165, 0.97);
        }

        .action-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .action-btn:disabled:hover {
            background: inherit;
        }

        .action-replace {
            background: rgba(219, 234, 254, 0.92);
            color: #1e40af;
            border-right: 1px solid rgba(0, 0, 0, 0.06);
        }

        .action-replace:hover:not(:disabled) {
            background: rgba(191, 219, 254, 0.97);
        }

        .action-download {
            background: rgba(243, 244, 246, 0.92);
            color: #374151;
        }

        .action-download:hover {
            background: rgba(229, 231, 235, 0.97);
        }

        .toast-replace .toast-icon {
            background: #dbeafe;
            color: #1e40af;
        }

        .toast-error .toast-icon {
            background: #fee2e2;
            color: #991b1b;
        }

        /* ── PAGINATION ── */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            margin-top: 32px;
        }

        .page-btn {
            min-width: 40px;
            height: 40px;
            padding: 0 14px;
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-muted);
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .page-btn:hover:not(:disabled):not(.active) {
            border-color: #999;
            color: var(--dark);
            background: var(--surface);
        }

        .page-btn.active {
            background: var(--dark);
            border-color: var(--dark);
            color: #fff;
        }

        .page-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .page-info {
            color: var(--text-dim);
            padding: 0 6px;
            font-size: 14px;
        }

        /* ── TOAST ── */
        .toast-container {
            position: fixed;
            bottom: 28px;
            right: 28px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }

        .toast {
            padding: 12px 18px;
            border-radius: var(--radius-sm);
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            border: 1px solid var(--border);
            animation: toastIn 0.22s ease forwards;
            max-width: 320px;
            background: var(--surface);
            color: var(--text);
        }

        .toast-icon {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            flex-shrink: 0;
        }

        .toast-accept .toast-icon {
            background: #dcfce7;
            color: #166534;
        }

        .toast-reject .toast-icon {
            background: #fee2e2;
            color: #991b1b;
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes toastOut {
            from {
                opacity: 1;
            }

            to {
                opacity: 0;
                transform: translateY(-8px);
            }
        }

        /* ── EMPTY ── */
        .empty-state {
            grid-column: 1 / -1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 20px;
            gap: 12px;
            text-align: center;
        }

        .empty-icon {
            font-size: 40px;
            opacity: 0.3;
        }

        .empty-icon-img {
            width: 44px;
            height: 44px;
            opacity: 0.35;
        }

        .empty-title {
            font-family: 'Space Mono', monospace;
            font-size: 14px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        @media (max-width: 640px) {
            .topbar {
                padding: 14px 16px;
            }

            .page {
                padding: 20px 16px 40px;
            }
        }
    </style>
</head>

<body>

    <!-- TOPBAR -->
    <div class="topbar">
        <div class="topbar-brand">
            <div class="brand-dot">A</div>
            <span class="brand-name">MIS ARCHIVOS</span>
            {% if folio %}
            <span class="brand-folio">{{ folio }}</span>
            {% endif %}
        </div>
        <div class="topbar-right">
            <div class="user-chip">
                <div class="user-avatar">{{ username[0] | upper if username else 'U' }}</div>
                <span class="user-name">{{ username or 'Usuario' }}</span>
            </div>
            <a href="{{ back_url or '/index' }}" class="topbar-link">← Volver</a>
            <a href="/logout" class="topbar-link">Cerrar sesión</a>
        </div>
    </div>

    <div class="page">

        <!-- STATS -->
        <div class="stats-bar">
            <span class="stat-pill">Total: <strong id="totalImages">0</strong></span>
            <span class="stat-pill">Página <strong id="currentPageDisplay">1</strong> / <strong
                    id="totalPagesDisplay">1</strong></span>
        </div>

        <!-- GALLERY -->
        <div class="gallery-grid" id="galleryGrid"></div>
        <div class="pagination" id="pagination"></div>

    </div>

    <!-- REPLACE FILE INPUT -->
    <input type="file" id="replaceFileInput" style="display:none;">

    <!-- TOASTS -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        const rawImages = {{ images | tojson | safe }};
        let allImages = rawImages || [];
        const USER_ROLE = {{ role | tojson | safe }};

        if (window.pdfjsLib) {
            window.pdfjsLib.GlobalWorkerOptions.workerSrc =
                "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
        }

        const ITEMS_PER_PAGE = 30;
        let currentPage = 1;

        const FALLBACK_BACK_URL = '{{ back_url or "/index" }}';

        function goBack() {
            if (document.referrer && document.referrer.length > 0) {
                window.location.href = document.referrer;
            } else {
                window.location.href = FALLBACK_BACK_URL;
            }
        }

        function getStatusBadgeHtml(status) {
            let cls = 'status-pending', label = 'Pendiente';
            if (status === 'asignado') { cls = 'status-pending'; label = 'Asignado'; }
            if (status === 'en_revision') { cls = 'status-revision'; label = 'En revisión'; }
            if (status === 'aceptado') { cls = 'status-accepted'; label = 'Aceptado'; }
            if (status === 'rechazado') { cls = 'status-rejected'; label = 'Rechazado'; }
            return `<span class="status-badge ${cls}"><span class="badge-dot"></span>${label}</span>`;
        }

        function renderGallery() {
            const grid = document.getElementById('galleryGrid');
            const startIdx = (currentPage - 1) * ITEMS_PER_PAGE;
            const pageImages = allImages.slice(startIdx, startIdx + ITEMS_PER_PAGE);

            if (pageImages.length === 0) {
                grid.innerHTML = `<div class="empty-state">
                    <div class="empty-icon"><img src="/static/file.svg" alt="Sin archivos" class="empty-icon-img"></div>
                    <div class="empty-title">Sin archivos</div>
                </div>`;
                renderPagination();
                updatePageInfo();
                return;
            }

            grid.innerHTML = pageImages.map((image, idx) => {
                const globalIdx = startIdx + idx;
                return buildCardHtml(image, globalIdx);
            }).join('');

            renderPdfThumbnails(grid);

            renderPagination();
            updatePageInfo();
        }

        async function renderPdfThumbnailDataUrl(pdfUrl, targetWidth = 240) {
            if (!window.pdfjsLib || !pdfUrl) return null;
            try {
                const task = window.pdfjsLib.getDocument(pdfUrl);
                const pdf = await task.promise;
                const page = await pdf.getPage(1);
                const viewport = page.getViewport({ scale: 1 });
                const scale = targetWidth / viewport.width;
                const scaled = page.getViewport({ scale });

                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d', { alpha: false });
                canvas.width = Math.max(1, Math.floor(scaled.width));
                canvas.height = Math.max(1, Math.floor(scaled.height));

                await page.render({ canvasContext: ctx, viewport: scaled }).promise;
                return canvas.toDataURL('image/png');
            } catch (error) {
                console.error('No se pudo generar miniatura PDF:', error);
                return null;
            }
        }

        async function renderPdfThumbnails(scopeElement) {
            const scope = scopeElement || document;
            const targets = Array.from(scope.querySelectorAll('img[data-pdf-src]:not([data-pdf-rendered="1"])'));
            for (const img of targets) {
                img.dataset.pdfRendered = '1';
                const pdfUrl = img.dataset.pdfSrc;
                const thumb = await renderPdfThumbnailDataUrl(pdfUrl);
                if (thumb) {
                    img.src = thumb;
                } else {
                    img.src = '/static/file-pdf-box.svg';
                }
            }
        }

        function handleAction(idx, action) {
            const image = allImages[idx];
            if (!image) return;

            const newStatus = action === 'aceptar' ? 'aceptado' : 'rechazado';
            const previousStatus = image.status;

            const card = document.querySelector(`.image-card[data-idx="${idx}"]`);
            const acceptBtn = card?.querySelector('.action-accept');
            const rejectBtn = card?.querySelector('.action-reject');

            if (acceptBtn) acceptBtn.disabled = true;
            if (rejectBtn) rejectBtn.disabled = true;

            if (!image.file_path) {
                showToast('error', 'No se puede identificar el archivo');
                if (card) card.outerHTML = buildCardHtml(image, idx);
                return;
            }

            fetch('/api/update-assignment-status', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    file_path: image.file_path,
                    status: newStatus
                })
            })
                .then(async res => {
                    const data = await res.json().catch(() => ({}));
                    if (!res.ok) {
                        throw new Error(data.error || 'No se pudo actualizar el estatus.');
                    }

                    image.status = data.new_status || newStatus;

                    if (card) {
                        const badge = card.querySelector('.status-badge');
                        if (badge) {
                            const isAccept = image.status === 'aceptado';
                            badge.className = `status-badge ${isAccept ? 'status-accepted' : 'status-rejected'}`;
                            badge.innerHTML = `<span class="badge-dot"></span>${isAccept ? 'Aceptado' : 'Rechazado'}`;
                        }
                        const updatedAcceptBtn = card.querySelector('.action-accept');
                        const updatedRejectBtn = card.querySelector('.action-reject');
                        if (updatedAcceptBtn) updatedAcceptBtn.disabled = (image.status === 'aceptado');
                        if (updatedRejectBtn) updatedRejectBtn.disabled = (image.status === 'rechazado');
                    }

                    showToast(action, image.name);
                })
                .catch(error => {
                    image.status = previousStatus;
                    showToast('error', error.message || 'No se pudo actualizar el estatus');
                    if (card) card.outerHTML = buildCardHtml(image, idx);
                });
        }

        function getCardActionsHtml(image, globalIdx) {
            if (USER_ROLE === 'cliente') {
                const isAccepted = image.status === 'aceptado';
                return `<div class="card-actions">
                    <button class="action-btn action-replace"
                        onclick="handleReplace(${globalIdx})"
                        ${isAccepted ? 'disabled' : ''}>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
                            <path d="M21 3v5h-5"/>
                            <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
                            <path d="M8 16H3v5"/>
                        </svg>
                        Reemplazar
                    </button>
                    <button class="action-btn action-download"
                        onclick="handleDownload(${globalIdx})">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="7 10 12 15 17 10"/>
                            <line x1="12" y1="15" x2="12" y2="3"/>
                        </svg>
                        Descargar
                    </button>
                </div>`;
            }
            return `<div class="card-actions">
                <button class="action-btn action-accept"
                    onclick="handleAction(${globalIdx}, 'aceptar')"
                    ${image.status === 'aceptado' ? 'disabled' : ''}>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                        <polyline points="20 6 9 17 4 12"/>
                    </svg>
                    Aceptar
                </button>
                <button class="action-btn action-reject"
                    onclick="handleAction(${globalIdx}, 'rechazar')"
                    ${image.status === 'rechazado' ? 'disabled' : ''}>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                    Rechazar
                </button>
            </div>`;
        }

        function getPreviewIconByExt(ext) {
            const extension = String(ext || '').toLowerCase();
            if (['zip', '7z', 'tar', 'gz'].includes(extension)) return '/static/zip-box.svg';
            if (extension === 'rar') return '/static/folder-rar.svg';
            if (extension === 'csv') return '/static/file-delimited-outline.svg';
            if (['xls', 'xlsx', 'xlsm'].includes(extension)) return '/static/microsoft-excel.svg';
            if (['doc', 'docx', 'odt', 'rtf'].includes(extension)) return '/static/file-word-box.svg';
            if (extension === 'pdf') return '/static/file-pdf-box.svg';
            if (['mp4', 'mov', 'avi', 'mkv', 'webm', 'wmv'].includes(extension)) return '/static/video.svg';
            if (['mp3', 'wav', 'aac', 'ogg', 'flac', 'm4a'].includes(extension)) return '/static/music-box-multiple.svg';
            return '/static/file.svg';
        }

        function getCardPreviewHtml(image) {
            const ext = String(image.ext || '').toLowerCase();
            if (image.is_image && image.url) {
                return `<img src="${image.url}" alt="${image.name}" class="image-preview" loading="lazy">`;
            }
            if (ext === 'pdf' && image.url) {
                return `<img class="image-preview" src="/static/file-pdf-box.svg" data-pdf-src="${image.url}" alt="Vista previa PDF" loading="lazy">`;
            }
            return `<div class="file-preview">
                        <img src="${getPreviewIconByExt(ext)}" alt="Archivo" class="file-preview-icon-img">
                        <div class="file-preview-ext">${ext || 'archivo'}</div>
                    </div>`;
        }

        function buildCardHtml(image, globalIdx) {
            return `
            <article class="image-card" data-idx="${globalIdx}">
                <div class="image-preview-container">
                    ${getCardPreviewHtml(image)}
                    ${getStatusBadgeHtml(image.status)}
                    <div class="image-overlay">
                        <div class="overlay-name">${image.name}</div>
                        <div class="overlay-meta">Folio: ${image.folio || 'N/A'}</div>
                        <div class="overlay-meta">${(image.size / 1024).toFixed(1)} KB</div>
                    </div>
                    ${getCardActionsHtml(image, globalIdx)}
                </div>
            </article>`;
        }

        function handleReplace(idx) {
            const image = allImages[idx];
            if (!image || image.status === 'aceptado') return;
            const input = document.getElementById('replaceFileInput');
            input.dataset.idx = idx;
            input.accept = image.ext ? '.' + image.ext : '';
            input.value = '';
            input.click();
        }

        async function handleDownload(idx) {
            const image = allImages[idx];
            if (!image) return;
            try {
                const res = await fetch(image.url);
                if (!res.ok) throw new Error('Download failed');
                const blob = await res.blob();
                const blobUrl = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = image.name;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(blobUrl);
            } catch (e) {
                showToast('error', 'Error al descargar');
            }
        }

        document.getElementById('replaceFileInput').addEventListener('change', async function () {
            const idx = parseInt(this.dataset.idx);
            const file = this.files[0];
            this.value = '';
            if (!file || isNaN(idx)) return;
            const image = allImages[idx];
            if (!image || !image.file_path) {
                showToast('error', 'No se puede identificar el archivo');
                return;
            }
            const card = document.querySelector(`.image-card[data-idx="${idx}"]`);
            const btn = card?.querySelector('.action-replace');
            if (btn) { btn.disabled = true; btn.textContent = 'Subiendo…'; }
            const formData = new FormData();
            formData.append('file', file);
            formData.append('file_path', image.file_path);
            try {
                const res = await fetch('/api/file/replace', { method: 'POST', body: formData });
                const data = await res.json();
                if (!res.ok) {
                    showToast('error', data.error || 'Error al reemplazar');
                    if (card) card.outerHTML = buildCardHtml(image, idx);
                    return;
                }
                image.status = 'asignado';
                if (data.url) {
                    const sep = data.url.includes('?') ? '&' : '?';
                    image.url = data.url + sep + 't=' + Date.now();
                }
                if (card) card.outerHTML = buildCardHtml(image, idx);
                showToast('replace', image.name);
            } catch (e) {
                showToast('error', 'Error de conexión');
                if (card) card.outerHTML = buildCardHtml(image, idx);
            }
        });

        function showToast(action, filename) {
            const container = document.getElementById('toastContainer');
            const t = document.createElement('div');
            let cls, icon, label;
            if (action === 'aceptar') {
                cls = 'toast-accept'; icon = '✓'; label = 'Aceptado';
            } else if (action === 'rechazar') {
                cls = 'toast-reject'; icon = '✗'; label = 'Rechazado';
            } else if (action === 'replace') {
                cls = 'toast-replace'; icon = '↻'; label = 'Reemplazado';
            } else {
                cls = 'toast-error'; icon = '!';
                t.className = `toast ${cls}`;
                t.innerHTML = `<span class="toast-icon">${icon}</span><span>${filename || action}</span>`;
                container.appendChild(t);
                setTimeout(() => {
                    t.style.animation = 'toastOut 0.22s ease forwards';
                    setTimeout(() => t.remove(), 220);
                }, 3500);
                return;
            }
            const name = (filename || '').length > 30 ? (filename || '').slice(0, 30) + '…' : (filename || '');
            t.className = `toast ${cls}`;
            t.innerHTML = `
                <span class="toast-icon">${icon}</span>
                <span>${label}: <strong>${name}</strong></span>`;
            container.appendChild(t);
            setTimeout(() => {
                t.style.animation = 'toastOut 0.22s ease forwards';
                setTimeout(() => t.remove(), 220);
            }, 2800);
        }

        function renderPagination() {
            const totalPages = Math.ceil(allImages.length / ITEMS_PER_PAGE);
            const pagination = document.getElementById('pagination');
            if (totalPages <= 1) { pagination.innerHTML = ''; return; }

            let buttons = [];
            buttons.push(`<button class="page-btn" onclick="goToPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>← Ant.</button>`);

            const maxVisible = 7;
            let startPage = Math.max(1, currentPage - Math.floor(maxVisible / 2));
            let endPage = Math.min(totalPages, startPage + maxVisible - 1);
            if (endPage - startPage < maxVisible - 1) startPage = Math.max(1, endPage - maxVisible + 1);

            if (startPage > 1) {
                buttons.push(`<button class="page-btn" onclick="goToPage(1)">1</button>`);
                if (startPage > 2) buttons.push(`<span class="page-info">…</span>`);
            }
            for (let i = startPage; i <= endPage; i++) {
                buttons.push(`<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`);
            }
            if (endPage < totalPages) {
                if (endPage < totalPages - 1) buttons.push(`<span class="page-info">…</span>`);
                buttons.push(`<button class="page-btn" onclick="goToPage(${totalPages})">${totalPages}</button>`);
            }
            buttons.push(`<button class="page-btn" onclick="goToPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>Sig. →</button>`);

            pagination.innerHTML = buttons.join('');
        }

        function goToPage(page) {
            const totalPages = Math.ceil(allImages.length / ITEMS_PER_PAGE);
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            renderGallery();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function updatePageInfo() {
            const totalPages = Math.ceil(allImages.length / ITEMS_PER_PAGE) || 1;
            document.getElementById('totalImages').textContent = allImages.length;
            document.getElementById('currentPageDisplay').textContent = currentPage;
            document.getElementById('totalPagesDisplay').textContent = totalPages;
        }

        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft') goToPage(currentPage - 1);
            if (e.key === 'ArrowRight') goToPage(currentPage + 1);
        });

        renderGallery();
    </script>
</body>

</html>
