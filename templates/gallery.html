<!--====================================================================================================
    # Vista del cliente con su galeria de archivos subidos, filtros, estados y descargas.
    #====================================================================================================-->
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Archivos</title>
    <link rel="icon" href="/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            min-height: 100vh;
            padding: 0;
            color: #ffffff;
            -webkit-font-smoothing: antialiased;
        }

        /* ========== TOPBAR ========== */
        .topbar {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding: 16px 32px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .topbar-content {
            max-width: 1800px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #ECD925 0%, #f4e66e 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-badge {
            padding: 8px 16px;
            background: #ECD925;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #000;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .user-badge img {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            filter: none;
        }

        .topbar-link {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            text-decoration: none;
            color: rgba(255, 255, 255, 0.8);
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .topbar-link:hover {
            background: rgba(236, 217, 37, 0.15);
            border-color: rgba(236, 217, 37, 0.3);
            color: #ECD925;
        }

        .container {
            max-width: 1800px;
            margin: 0 auto;
            padding: 40px 32px;
        }

        /* ========== FILTERS SECTION ========== */
        .filters-section {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 32px;
            margin-bottom: 32px;
            position: relative;
            overflow: hidden;
        }

        .filters-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, #ECD925, transparent);
        }

        .filters-title {
            font-size: 16px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 24px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .filter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        .filter-field label {
            display: block;
            margin-bottom: 8px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .filter-field input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
        }

        .filter-field input:focus {
            outline: none;
            border-color: rgba(236, 217, 37, 0.5);
            background: rgba(255, 255, 255, 0.08);
        }

        .filter-field input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .filter-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: #ECD925;
            border-color: #ECD925;
            color: #1a1a1a;
        }

        .btn-primary:hover {
            background: #f4e66e;
            border-color: #f4e66e;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.8);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
            color: #ffffff;
        }

        .stats {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(236, 217, 37, 0.1);
            border: 1px solid rgba(236, 217, 37, 0.2);
            color: #ECD925;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
        }

        /* ========== GALLERY GRID ========== */
        .gallery-section {
            margin-bottom: 40px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
            margin-bottom: 32px;
        }

        @media (max-width: 1400px) {
            .gallery-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        @media (max-width: 1100px) {
            .gallery-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 768px) {
            .gallery-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 480px) {
            .gallery-grid {
                grid-template-columns: 1fr;
            }
        }

        .image-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            aspect-ratio: 1;
            position: relative;
        }

        .image-card:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(236, 217, 37, 0.3);
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
        }

        .image-preview-container {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.03);
        }

        .image-preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .file-preview {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(236, 217, 37, 0.05) 0%, rgba(236, 217, 37, 0.02) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .file-preview-icon {
            font-size: 48px;
        }

        .file-preview-ext {
            font-size: 14px;
            font-weight: 700;
            color: #ECD925;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .image-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.9), transparent);
            padding: 20px 16px 16px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .image-card:hover .image-overlay {
            opacity: 1;
        }

        .overlay-name {
            font-size: 13px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .overlay-meta {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 4px;
        }

        .status-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            padding: 6px 12px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .status-pending {
            color: #fbbf24;
            border-color: rgba(251, 191, 36, 0.3);
            background: rgba(251, 191, 36, 0.1);
        }

        .status-accepted {
            color: #34d399;
            border-color: rgba(52, 211, 153, 0.3);
            background: rgba(52, 211, 153, 0.1);
        }

        .status-rejected {
            background: #D74A3D;
            border: 1px solid #D74A3D;
            color: #ffffff;
        }

        /* ========== PAGINATION ========== */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 40px;
        }

        .page-btn {
            min-width: 44px;
            height: 44px;
            padding: 0 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .page-btn:hover:not(:disabled):not(.active) {
            background: rgba(236, 217, 37, 0.1);
            border-color: rgba(236, 217, 37, 0.3);
            color: #ECD925;
        }

        .page-btn.active {
            background: #ECD925;
            border-color: #ECD925;
            color: #1a1a1a;
        }

        .page-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .page-info {
            color: rgba(255, 255, 255, 0.3);
            padding: 0 8px;
            font-size: 14px;
        }

        /* ========== PREVIEW MODAL ========== */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(12px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .modal.active {
            display: flex;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .modal-content {
            background: #1f1f1f;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            max-width: 1000px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            padding: 24px 32px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
        }

        .modal-close {
            width: 36px;
            height: 36px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close:hover {
            background: rgba(248, 113, 113, 0.2);
            border-color: rgba(248, 113, 113, 0.3);
            color: #f87171;
        }

        .modal-body {
            padding: 32px;
        }

        .preview-image-container {
            width: 100%;
            max-height: 500px;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 24px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .preview-image {
            width: 100%;
            height: auto;
            display: block;
        }

        .preview-info {
            margin-bottom: 24px;
        }

        .preview-name {
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 12px;
        }

        .preview-meta {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
        }

        .preview-actions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
            padding-top: 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .modal-btn {
            padding: 14px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .modal-btn:hover {
            background: rgba(236, 217, 37, 0.15);
            border-color: rgba(236, 217, 37, 0.3);
            color: #ECD925;
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 768px) {
            .topbar {
                padding: 12px 16px;
            }

            .topbar-content {
                flex-direction: column;
                gap: 12px;
            }

            .container {
                padding: 24px 16px;
            }

            .filters-section {
                padding: 24px 20px;
            }

            .filter-grid {
                grid-template-columns: 1fr;
            }

            .preview-actions {
                grid-template-columns: 1fr;
            }
        }

        /* INLINE SVG ICONS */
        .inline-icon {
            width: 18px;
            height: 18px;
            display: inline-block;
            vertical-align: middle;
            margin-right: 6px;
        }

        /* Style guide overrides */
        :root {
            --primary: #484848;
            --secondary: #ECD925;
            --accent: #6C6C6C;
            --success: #408D53;
            --warning: #D15300;
            --error: #D74A3D;
            --info: #F6DF06;
            --neutral-900: #282828;
            --neutral-800: #404040;
            --neutral-700: #4B4B4B;
            --neutral-600: #626262;
            --neutral-500: #6C6C6C;
            --neutral-400: #878787;
            --neutral-300: #ADADAD;
            --neutral-200: #DBDBDB;
            --neutral-100: #FFFFFF;
            --yellow-900: #382C00;
            --yellow-800: #585400;
            --yellow-700: #867E00;
            --yellow-600: #B8AA00;
            --yellow-500: #ECD925;
            --font-family: 'Inter', sans-serif;
        }

        body {
            font-family: var(--font-family);
            background: var(--neutral-100);
            color: var(--neutral-800);
        }

        .topbar {
            background: var(--neutral-100);
            border-bottom: 1px solid var(--neutral-200);
        }

        .logo {
            background: none;
            color: var(--primary);
            -webkit-text-fill-color: initial;
        }

        .user-badge {
            background: var(--secondary);
            color: var(--yellow-900);
        }

        .topbar-link {
            background: var(--neutral-100);
            border-color: var(--neutral-200);
            color: var(--neutral-700);
        }

        .topbar-link:hover {
            background: var(--secondary);
            border-color: var(--secondary);
            color: var(--yellow-900);
        }

        .filters-section {
            background: var(--neutral-100);
            border-color: var(--neutral-200);
        }

        .filters-section::before {
            background: linear-gradient(90deg, var(--secondary), transparent);
        }

        .filters-title {
            color: var(--neutral-900);
        }

        .filter-field label {
            color: var(--neutral-600);
        }

        .filter-field input {
            background: var(--neutral-100);
            border-color: var(--neutral-300);
            color: var(--neutral-800);
        }

        .filter-field input:focus {
            border-color: var(--secondary);
            background: var(--neutral-100);
            box-shadow: 0 0 0 2px rgba(236, 217, 37, 0.2);
        }

        .btn {
            border-radius: 6px;
        }

        .btn-primary {
            background: var(--primary);
            border-color: var(--primary);
            color: var(--neutral-100);
        }

        .btn-primary:hover {
            background: var(--neutral-800);
            border-color: var(--neutral-800);
        }

        .btn-secondary {
            background: var(--secondary);
            color: var(--yellow-900);
            border-color: var(--secondary);
        }

        .btn-secondary:hover {
            background: var(--yellow-600);
            border-color: var(--yellow-600);
            color: var(--yellow-900);
        }

        .stat-badge {
            background: rgba(236, 217, 37, 0.15);
            border-color: rgba(236, 217, 37, 0.3);
            color: var(--yellow-800);
        }

        .image-card {
            background: var(--neutral-100);
            border-color: var(--neutral-200);
        }

        .image-card:hover {
            border-color: var(--secondary);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
        }

        .file-preview {
            background: linear-gradient(135deg, rgba(236, 217, 37, 0.08) 0%, rgba(236, 217, 37, 0.02) 100%);
        }

        .file-preview-ext {
            color: var(--yellow-800);
        }

        .status-pending {
            color: var(--warning);
            border-color: rgba(209, 83, 0, 0.3);
            background: rgba(209, 83, 0, 0.1);
        }

        .status-accepted {
            color: var(--success);
            border-color: rgba(64, 141, 83, 0.3);
            background: rgba(64, 141, 83, 0.1);
        }

        .status-rejected {
            color: var(--error);
            border-color: rgba(215, 74, 61, 0.3);
            background: rgba(215, 74, 61, 0.1);
        }
    </style>
</head>

<body>
    <!-- Topbar -->
    <div class="topbar">
        <div class="topbar-content">
            <div class="topbar-left">
                <div class="logo">MIS ARCHIVOS</div>
            </div>
            <div class="topbar-right">
                <div class="user-badge"><img src="/static/icon-user.svg" alt="usuario" class="inline-icon"> {{ username
                    }}</div>
                <a href="/index" class="topbar-link">Inicio</a>
                <a href="/logout" class="topbar-link">Cerrar sesión</a>
            </div>
        </div>
    </div>

    <div class="container">
        <!-- Filters Section -->
        <div class="filters-section">
            <h3 class="filters-title">Filtros</h3>
            <form method="GET" action="/gallery">
                <div class="filter-grid">
                    <div class="filter-field">
                        <label for="client">Cliente</label>
                        <input type="text" id="client" name="client" placeholder="Nombre del cliente"
                            value="{{ client or '' }}">
                    </div>
                    <div class="filter-field">
                        <label for="folio">Folio</label>
                        <input type="text" id="folio" name="folio" placeholder="Número de folio"
                            value="{{ folio or '' }}">
                    </div>
                    <div class="filter-field">
                        <label for="filename">Nombre de archivo</label>
                        <input type="text" id="filename" name="filename" placeholder="Buscar archivo"
                            value="{{ filename or '' }}">
                    </div>
                    <div class="filter-field">
                        <label for="date">Fecha</label>
                        <input type="date" id="date" name="date" value="{{ date or '' }}">
                    </div>
                </div>
                <div class="filter-actions">
                    <button type="submit" class="btn btn-primary">Buscar</button>
                    <button type="button" class="btn btn-secondary" onclick="resetFilters()">Limpiar</button>
                </div>
                <div class="stats">
                    <span class="stat-badge">Total de imágenes: <strong id="totalImages">0</strong></span>
                    <span class="stat-badge">Página: <strong id="currentPageDisplay">1</strong> de <strong
                            id="totalPagesDisplay">1</strong></span>
                </div>
            </form>
        </div>

        <!-- Gallery Grid -->
        <div class="gallery-section">
            <div class="gallery-grid" id="galleryGrid"></div>
            <div class="pagination" id="pagination"></div>
        </div>
    </div>

    <!-- Preview Modal -->
    <div id="previewModal" class="modal" onclick="closePreview()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <div class="modal-title">Vista previa</div>
                <button class="modal-close" onclick="closePreview()">✕</button>
            </div>
            <div class="modal-body">
                <div class="preview-image-container">
                    <img id="previewImage" class="preview-image" alt="Preview">
                </div>
                <div class="preview-info">
                    <div class="preview-name" id="previewName"></div>
                    <div class="preview-meta" id="previewMeta"></div>
                </div>
                <div class="preview-actions">
                    <a id="previewCheckStatusLink" class="modal-btn">
                        Ver detalles
                    </a>
                    <a id="previewDownloadLink" class="modal-btn">
                        Descargar
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Datos de las imágenes desde el servidor
        const rawImages = {{ images | tojson | safe }};
        let allImages = rawImages || [];
        const ITEMS_PER_PAGE = 30; // 5x6
        let currentPage = 1;
        let imageStatuses = {};

        // Inicializar
        function init() {
            renderGallery();
            loadAllStatuses();
        }

        // Renderizar galería
        function renderGallery() {
            const grid = document.getElementById('galleryGrid');
            const startIdx = (currentPage - 1) * ITEMS_PER_PAGE;
            const endIdx = startIdx + ITEMS_PER_PAGE;
            const pageImages = allImages.slice(startIdx, endIdx);

            grid.innerHTML = pageImages.map((image, idx) => {
                const globalIdx = startIdx + idx;
                return `
                    <article class="image-card" onclick="showPreview(${globalIdx})">
                        <div class="image-preview-container">
                            ${image.is_image
                        ? `<img src="${image.url}" alt="${image.name}" class="image-preview" loading="lazy">`
                        : `<div class="file-preview">
                                       <div class="file-preview-icon">FILE</div>
                                       <div class="file-preview-ext">${image.ext || 'file'}</div>
                                   </div>`
                    }
                            <div class="image-overlay">
                                <div class="overlay-name">${image.name}</div>
                                <div class="overlay-meta">Folio: ${image.folio || 'N/A'}</div>
                                <div class="overlay-meta">${(image.size / 1024).toFixed(1)} KB</div>
                            </div>
                            <div id="status-badge-${globalIdx}" style="display: none;"></div>
                        </div>
                    </article>
                `;
            }).join('');

            renderPagination();
            updatePageInfo();
        }

        // Renderizar paginación
        function renderPagination() {
            const totalPages = Math.ceil(allImages.length / ITEMS_PER_PAGE);
            const pagination = document.getElementById('pagination');

            if (totalPages <= 1) {
                pagination.innerHTML = '';
                return;
            }

            let buttons = [];

            // Botón anterior
            buttons.push(`
                <button class="page-btn" onclick="goToPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>
                    ← Anterior
                </button>
            `);

            // Páginas
            const maxVisible = 7;
            let startPage = Math.max(1, currentPage - Math.floor(maxVisible / 2));
            let endPage = Math.min(totalPages, startPage + maxVisible - 1);

            if (endPage - startPage < maxVisible - 1) {
                startPage = Math.max(1, endPage - maxVisible + 1);
            }

            if (startPage > 1) {
                buttons.push(`<button class="page-btn" onclick="goToPage(1)">1</button>`);
                if (startPage > 2) {
                    buttons.push(`<span class="page-info">...</span>`);
                }
            }

            for (let i = startPage; i <= endPage; i++) {
                buttons.push(`
                    <button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">
                        ${i}
                    </button>
                `);
            }

            if (endPage < totalPages) {
                if (endPage < totalPages - 1) {
                    buttons.push(`<span class="page-info">...</span>`);
                }
                buttons.push(`<button class="page-btn" onclick="goToPage(${totalPages})">${totalPages}</button>`);
            }

            // Botón siguiente
            buttons.push(`
                <button class="page-btn" onclick="goToPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>
                    Siguiente →
                </button>
            `);

            pagination.innerHTML = buttons.join('');
        }

        // Cambiar de página
        function goToPage(page) {
            const totalPages = Math.ceil(allImages.length / ITEMS_PER_PAGE);
            if (page < 1 || page > totalPages) return;

            currentPage = page;
            renderGallery();
            window.scrollTo({ top: 0, behavior: 'smooth' });

            // Cargar estados de la nueva página
            loadPageStatuses();
        }

        // Actualizar info de página
        function updatePageInfo() {
            const totalPages = Math.ceil(allImages.length / ITEMS_PER_PAGE);
            document.getElementById('currentPageDisplay').textContent = currentPage;
            document.getElementById('totalPagesDisplay').textContent = totalPages;
            document.getElementById('totalImages').textContent = allImages.length;
        }

        // Cargar estados de imágenes de la página actual
        async function loadPageStatuses() {
            const startIdx = (currentPage - 1) * ITEMS_PER_PAGE;
            const endIdx = startIdx + ITEMS_PER_PAGE;
            const pageImages = allImages.slice(startIdx, endIdx);

            for (let i = 0; i < pageImages.length; i++) {
                const globalIdx = startIdx + i;
                const image = pageImages[i];

                try {
                    const statusKey = image.file_path || image.name;
                    const res = await fetch(`/api/image-status?filename=${encodeURIComponent(image.name)}&file_path=${encodeURIComponent(image.file_path || '')}`);
                    if (res.ok) {
                        const data = await res.json();
                        imageStatuses[statusKey] = data.status;
                        updateStatusBadge(globalIdx, data.status);
                    }
                } catch (e) {
                    console.error('Error loading status:', e);
                }
            }
        }

        // Cargar todos los estados (en background)
        async function loadAllStatuses() {
            loadPageStatuses(); // Cargar primero la página actual

            // Luego cargar el resto en background
            for (let i = 0; i < allImages.length; i++) {
                const image = allImages[i];
                const statusKey = image.file_path || image.name;
                if (imageStatuses[statusKey]) continue; // Ya cargado

                try {
                    const res = await fetch(`/api/image-status?filename=${encodeURIComponent(image.name)}&file_path=${encodeURIComponent(image.file_path || '')}`);
                    if (res.ok) {
                        const data = await res.json();
                        imageStatuses[statusKey] = data.status;
                    }
                } catch (e) {
                    console.error('Error loading status:', e);
                }
            }
        }

        // Actualizar badge de estado
        function updateStatusBadge(idx, status) {
            const badge = document.getElementById(`status-badge-${idx}`);
            if (!badge) return;

            let statusClass = 'status-pending';
            let statusIcon = '●';
            let statusText = 'Subido';

            if (status === 'asignado') {
                statusClass = 'status-pending';
                statusIcon = '✎';
                statusText = 'Asignado';
            } else if (status === 'en_revision') {
                statusClass = 'status-pending';
                statusIcon = '◓';
                statusText = 'En revisión';
            } else if (status === 'aceptado') {
                statusClass = 'status-accepted';
                statusIcon = '✓';
                statusText = 'Aceptado';
            } else if (status === 'rechazado') {
                statusClass = 'status-rejected';
                statusIcon = '✗';
                statusText = 'Rechazado';
            }

            badge.innerHTML = `<span class="status-badge ${statusClass}">${statusIcon}</span>`;
            badge.style.display = 'block';
        }

        // Modal de vista previa
        function showPreview(idx) {
            const image = allImages[idx];
            if (!image) return;

            const modal = document.getElementById('previewModal');
            const previewImage = document.getElementById('previewImage');
            const previewName = document.getElementById('previewName');
            const previewMeta = document.getElementById('previewMeta');
            const previewCheckStatusLink = document.getElementById('previewCheckStatusLink');
            const previewDownloadLink = document.getElementById('previewDownloadLink');

            // Si es imagen, mostrar la imagen; si es documento, ocultar
            if (image.is_image) {
                previewImage.src = image.url;
                previewImage.style.display = 'block';
            } else {
                previewImage.style.display = 'none';
            }

            previewName.textContent = image.name;
            previewMeta.textContent = `Folio: ${image.folio || 'N/A'} • ${image.modified_iso} • ${(image.size / 1024).toFixed(1)} KB`;
            previewCheckStatusLink.href = `/view-image?filename=${encodeURIComponent(image.name)}&file_path=${encodeURIComponent(image.file_path || '')}`;
            previewDownloadLink.href = image.url;
            previewDownloadLink.download = image.name;

            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closePreview() {
            const modal = document.getElementById('previewModal');
            modal.classList.remove('active');
            document.body.style.overflow = '';
        }

        // Cerrar con ESC
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closePreview();
        });

        // Navegación con flechas
        document.addEventListener('keydown', (e) => {
            if (document.getElementById('previewModal').classList.contains('active')) return;

            if (e.key === 'ArrowLeft') {
                goToPage(currentPage - 1);
            } else if (e.key === 'ArrowRight') {
                goToPage(currentPage + 1);
            }
        });

        // Reset de filtros
        function resetFilters() {
            window.location.href = '/gallery';
        }

        // Inicializar al cargar
        init();
    </script>
</body>

</html>
